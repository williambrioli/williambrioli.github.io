    content: `



<p>Durante muitos anos, uma pessoa pode acreditar que é apenas "tímida". Evita participar de reuniões, sente medo intenso de conhecer pessoas novas, recusa oportunidades profissionais e deixa de viver experiências importantes por receio de ser julgada. Com o tempo, esse padrão deixa de ser apenas um traço de personalidade e passa a limitar relacionamentos, carreira, autoestima e qualidade de vida.</p>

<p>O Transtorno de Personalidade Evitativa (TPE) é um dos transtornos de personalidade descritos no <em>Manual Diagnóstico e Estatístico de Transtornos Mentais – DSM-5-TR</em>. Muito além da timidez, caracteriza-se por um padrão persistente de inibição social, sentimentos de inadequação e hipersensibilidade à avaliação negativa. Pessoas com esse transtorno desejam estabelecer vínculos, mas o medo da rejeição costuma ser tão intenso que acabam evitando justamente aquilo que mais gostariam de viver.</p>

<p>Uma boa metáfora para compreender esse funcionamento é imaginar uma ave que permanece dentro da própria gaiola mesmo com a porta aberta. Não é a falta de desejo de voar que a mantém ali, mas a convicção de que o mundo exterior representa perigo. Da mesma forma, quem apresenta Transtorno de Personalidade Evitativa frequentemente deseja proximidade, amizade e afeto, mas o medo constante da crítica e da rejeição torna qualquer aproximação emocional extremamente difícil.</p>

<h2>Explicação científica simplificada</h2>

<p>O Transtorno de Personalidade Evitativa pertence ao Grupo C dos transtornos de personalidade do DSM-5-TR, grupo caracterizado por padrões de comportamento marcados por ansiedade, medo e insegurança.</p>

<p>Segundo o DSM-5-TR, o transtorno consiste em um padrão persistente de inibição social, sentimentos de inadequação e hipersensibilidade à avaliação negativa, iniciado no começo da vida adulta e presente em diversos contextos.</p>

<p>Para que o diagnóstico seja considerado, é necessário que estejam presentes características como:</p>

<ul>
<li>Evitar atividades profissionais que envolvam contato interpessoal significativo por medo de críticas ou rejeição.</li>
<li>Relutância em envolver-se com pessoas sem garantia de aceitação.</li>
<li>Restrição nos relacionamentos íntimos por receio de vergonha ou ridicularização.</li>
<li>Preocupação constante em ser criticado ou rejeitado em situações sociais.</li>
<li>Inibição em novos contextos sociais devido ao sentimento de inadequação.</li>
<li>Autoimagem marcada pela percepção de inferioridade, incapacidade ou falta de atratividade.</li>
<li>Evitação de novos desafios pessoais ou profissionais por medo de constrangimento.</li>
</ul>

<p>Esses padrões precisam ser persistentes, causar sofrimento significativo ou prejuízo funcional e não serem mais bem explicados por outro transtorno mental, condição médica ou uso de substâncias.</p>

<h2>Características associadas</h2>

<p>Além dos critérios diagnósticos, o DSM-5 descreve diversas características frequentemente observadas em pessoas com Transtorno de Personalidade Evitativa.</p>

<p>Esses indivíduos costumam interpretar comentários neutros como críticas, apresentam elevada sensibilidade à desaprovação e frequentemente acreditam que serão rejeitados antes mesmo de qualquer interação ocorrer.</p>

<p>Apesar de desejarem relacionamentos afetivos, amizades e integração social, costumam restringir suas experiências por medo de fracassar ou passar vergonha.</p>

<p>Também podem apresentar:</p>

<ul>
<li>Baixa autoestima persistente.</li>
<li>Autocrítica intensa.</li>
<li>Ansiedade antecipatória diante de situações sociais.</li>
<li>Grande necessidade de segurança antes de confiar em alguém.</li>
<li>Tendência ao isolamento progressivo.</li>
<li>Hipervigilância diante de possíveis sinais de rejeição.</li>
</ul>

<p>Esse funcionamento psicológico costuma gerar um ciclo: quanto maior a evitação, menores as oportunidades de desenvolver experiências positivas, reforçando ainda mais a crença de incapacidade.</p>

<h2>Prevalência</h2>

<p>Segundo o DSM-5-TR, a prevalência estimada do Transtorno de Personalidade Evitativa na população geral varia em torno de 2% a 2,5%, embora diferentes estudos possam apresentar pequenas variações conforme a metodologia utilizada.</p>

<p>O transtorno é encontrado em homens e mulheres, sem diferenças consistentes de prevalência entre os sexos na maior parte das pesquisas atuais.</p>

<p>É importante diferenciar o transtorno de traços de timidez, introversão ou insegurança, que fazem parte da diversidade normal da personalidade humana e não configuram, por si só, um transtorno mental.</p>

<h2>Desenvolvimento e curso</h2>

<p>Os primeiros sinais frequentemente surgem ainda na infância ou adolescência, principalmente por meio de extrema timidez, medo de desconhecidos, retraimento social e elevada sensibilidade à crítica.</p>

<p>Entretanto, o diagnóstico de transtorno de personalidade geralmente é realizado apenas na vida adulta, quando esses padrões tornam-se persistentes e afetam diferentes áreas da vida.</p>

<p>O DSM-5 considera que fatores temperamentais, predisposições biológicas e experiências ambientais podem contribuir para o desenvolvimento do transtorno. Experiências repetidas de rejeição, humilhação, bullying, críticas excessivas ou superproteção familiar podem participar desse processo, embora não sejam causas únicas.</p>

<p>Sem tratamento, o padrão de evitação tende a se manter ao longo da vida, podendo limitar oportunidades acadêmicas, profissionais, afetivas e sociais. Entretanto, muitas pessoas apresentam melhora significativa quando recebem acompanhamento psicológico adequado.</p>

<h2>Diagnóstico diferencial</h2>

<p>O diagnóstico exige avaliação clínica cuidadosa, pois diversas condições apresentam sintomas semelhantes.</p>

<p>Entre os principais diagnósticos diferenciais descritos no DSM-5 destacam-se:</p>

<ul>
<li><strong>Transtorno de Ansiedade Social (Fobia Social):</strong> ambos apresentam medo de avaliação negativa. No entanto, no Transtorno de Personalidade Evitativa esse padrão faz parte da personalidade e está presente em praticamente todos os relacionamentos e contextos da vida.</li>

<li><strong>Transtorno de Personalidade Dependente:</strong> ambos apresentam insegurança, porém o dependente busca proximidade intensa e teme o abandono, enquanto o evitativo evita aproximação por medo da rejeição.</li>

<li><strong>Transtorno de Personalidade Esquizoide:</strong> pessoas com personalidade esquizoide geralmente demonstram pouco interesse por relações sociais, enquanto indivíduos com personalidade evitativa desejam esses vínculos, mas os evitam devido ao medo.</li>

<li><strong>Traços de timidez:</strong> muitas pessoas são naturalmente reservadas sem apresentar sofrimento clínico ou prejuízo funcional significativo.</li>
</ul>

<p>Somente uma avaliação realizada por profissional habilitado permite estabelecer um diagnóstico preciso.</p>

<h2>Comorbidades</h2>

<p>O Transtorno de Personalidade Evitativa frequentemente ocorre associado a outros transtornos mentais.</p>

<p>Entre as principais comorbidades descritas pelo DSM-5 encontram-se:</p>

<ul>
<li>Transtorno de Ansiedade Social.</li>
<li>Transtorno Depressivo Maior.</li>
<li>Transtornos de ansiedade em geral.</li>
<li>Transtorno de Personalidade Dependente.</li>
<li>Outros transtornos de personalidade do Grupo C.</li>
</ul>

<p>A presença dessas condições pode aumentar o sofrimento emocional e exigir planejamento terapêutico individualizado.</p>

<h2>Questões diagnósticas relativas ao sexo e ao gênero</h2>

<p>O DSM-5-TR informa que o Transtorno de Personalidade Evitativa parece ocorrer de forma relativamente semelhante entre homens e mulheres quando são utilizados critérios diagnósticos padronizados.</p>

<p>No entanto, fatores culturais, sociais e expectativas relacionadas aos papéis de gênero podem influenciar a forma como os sintomas são percebidos, expressos e reconhecidos.</p>

<p>Em alguns contextos culturais, comportamentos reservados podem ser mais socialmente aceitos em determinados grupos, o que pode retardar o reconhecimento do sofrimento psicológico ou dificultar a procura por tratamento.</p>

<p>Por isso, o diagnóstico deve sempre considerar o contexto sociocultural da pessoa, evitando interpretações baseadas apenas em estereótipos relacionados ao sexo ou ao gênero.</p>

<h2>Análise profissional aplicada ao tema</h2>

<p>Na prática clínica, pessoas com Transtorno de Personalidade Evitativa frequentemente chegam ao consultório relatando solidão, ansiedade intensa e sensação de incapacidade para estabelecer relacionamentos satisfatórios. Muitas vezes acreditam que "há algo errado" com elas, quando, na realidade, estão aprisionadas por um padrão de funcionamento emocional marcado pelo medo constante da rejeição.</p>

<p>É importante compreender que evitar situações sociais reduz momentaneamente a ansiedade, mas também impede novas experiências corretivas. Assim, o medo acaba sendo continuamente reforçado.</p>

<p>O tratamento busca desenvolver maior flexibilidade psicológica, fortalecer a autoestima, ampliar habilidades sociais e reduzir o impacto do medo da avaliação negativa.</p>

<h2>Aplicações práticas e orientações</h2>

<ul>
<li>Não confunda timidez com transtorno de personalidade.</li>
<li>Observe se o medo da rejeição limita sua vida de forma persistente.</li>
<li>Evite interpretar automaticamente críticas como rejeições pessoais.</li>
<li>Reconheça pequenas conquistas sociais como parte do processo de mudança.</li>
<li>Busque avaliação profissional quando perceber sofrimento significativo ou prejuízo nos relacionamentos.</li>
<li>Lembre-se de que mudanças consistentes costumam acontecer de maneira gradual.</li>
</ul>

<h2>Pontes para psicoterapia</h2>

<p>A psicoterapia constitui uma das principais formas de tratamento para o Transtorno de Personalidade Evitativa. O processo terapêutico oferece um ambiente seguro para compreender padrões emocionais, desenvolver autoestima mais consistente, trabalhar crenças de inadequação e construir formas mais saudáveis de estabelecer vínculos.</p>

<p>Ao longo do acompanhamento, muitas pessoas conseguem reduzir a intensidade da ansiedade social, ampliar sua participação em diferentes contextos e desenvolver relacionamentos mais satisfatórios e autênticos.</p>

<h2>Conclusão</h2>

<p>O Transtorno de Personalidade Evitativa vai muito além da simples timidez. Trata-se de um padrão persistente de funcionamento marcado pelo medo intenso da rejeição, sentimentos de inadequação e evitação de situações interpessoais que acabam limitando o desenvolvimento pessoal, profissional e afetivo.</p>

<p>Conhecer seus critérios diagnósticos, compreender suas características e reconhecer suas diferenças em relação à timidez ou à ansiedade social contribui para reduzir estigmas e favorecer o acesso ao tratamento adequado. Assim como a ave que permanece na gaiola por acreditar que o mundo externo representa perigo, muitas pessoas descobrem, por meio da psicoterapia, que podem desenvolver recursos internos para construir relações mais seguras e uma vida mais livre.</p>

<script>
/*
  Aqui começam várias funções importantes para fazer a página funcionar.
  Elas cuidam de:
  - transformar markdown em HTML
  - carregar lista de posts

/* ==========================================
   FUNÇÃO: simpleMarkdownToHtml()
   Serve para transformar markdown simples em HTML.
   ========================================== */
function simpleMarkdownToHtml(md) {
  if (!md) return '';

  // Troca quebras de linha antigas por novas
  let text = md.replace(/\r\n/g, '\n');

  // Títulos de vários níveis
  text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h2>$1</h2>');

  // Negrito **
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Itálico *
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Transformar listas
  text = text.replace(/^[\-\*] (.*)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/gm, match => `<ul>${match}</ul>`);

  // Transformar blocos separados por linha vazia em parágrafos
  const parts = text.split(/\n{2,}/).map(block => {
    if (/^<h[23]>/.test(block) || /^<ul>/.test(block)) {
      return block;
    }
    return `<p>${block.trim()}</p>`;
  });

  return parts.join('\n');
}


/* ==========================================
   CARREGAMENTO DE POSTS
   Lê o arquivo posts.json e cria os cards na página.
   ========================================== */

let POSTS_CACHE = [];

async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  const msgEl = document.getElementById('postsMessage');

  if (!grid || !msgEl) return;

  msgEl.style.display = 'none';
  msgEl.textContent = '';

  try {
    // Busca o arquivo que contém os posts
    const response = await fetch('/posts/posts.json', { cache: 'no-store' });

    if (!response.ok) {
      throw new Error('Não foi possível carregar a lista de artigos.');
    }

    const posts = await response.json();

    if (!Array.isArray(posts) || posts.length === 0) {
      msgEl.style.display = 'block';
      msgEl.textContent = 'Ainda não há artigos publicados.';
      return;
    }

    // Ordena do mais recente para o mais antigo
posts.sort((a, b) => new Date(b.date) - new Date(a.date));

POSTS_CACHE = posts;
renderPosts(posts, grid);

  } catch (err) {
    console.error(err);
    msgEl.style.display = 'block';
    msgEl.textContent = 'Ocorreu um problema ao carregar artigos.';
  }
}


/* ==========================================
   FUNÇÃO: renderPosts()
   Cria os cards dinamicamente dentro do grid.
   ========================================== */
function renderPosts(posts, container) {
  container.innerHTML = '';

  posts.forEach(post => {
    const card = document.createElement('article');
    card.className = 'post-card';

    // Capa
    if (post.cover) {
      const img = document.createElement('img');
      img.src = post.cover;
      img.alt = post.title || '';
      card.appendChild(img);
    }

    const body = document.createElement('div');
    body.className = 'post-card-body';

    // Tag (ex: Psicologia)
    if (Array.isArray(post.tags) && post.tags.length > 0) {
      const tag = document.createElement('span');
      tag.className = 'post-tag';
      tag.textContent = post.tags[0];
      body.appendChild(tag);
    }

    // Título
    const h3 = document.createElement('h3');
    h3.textContent = post.title || 'Artigo sem título';
    body.appendChild(h3);

    // Meta (data + autor)
    const meta = document.createElement('div');
    meta.className = 'post-meta';
    meta.textContent = formatPostMeta(post);
    body.appendChild(meta);

    // Resumo
    if (post.excerpt) {
      const excerpt = document.createElement('div');
      excerpt.className = 'post-excerpt';
      excerpt.textContent = post.excerpt;
      body.appendChild(excerpt);
    }

    // Botão do card
    const footer = document.createElement('div');
    footer.className = 'post-card-footer';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = window.SITE_DATA.buttons.readMore;
    // O texto vem do arquivo site-data.js

    btn.addEventListener('click', () => {
      // abre a página do artigo
      if (post.html) {
        window.location.href = "/" + post.html;
      }
    });

    footer.appendChild(btn);
    body.appendChild(footer);
    card.appendChild(body);
    container.appendChild(card);
  });
}


/* ==========================================
   FUNÇÃO: formatPostMeta()
   Formata a data + autor do post
   ========================================== */
function formatPostMeta(post) {
  let parts = [];

  if (post.date) {
    const d = new Date(post.date);
    if (!isNaN(d)) {
      const formatted = d.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
      parts.push(formatted);
    }
  }

  if (post.author) {
    parts.push('por ' + post.author);
  }

  return parts.join(' • ');
}


/* ==========================================
   FUNÇÃO DO MODAL (abrir e fechar)
   ========================================== */
const modalBackdrop = document.getElementById('postModalBackdrop');
const modalTitle = document.getElementById('postModalTitle');
const modalMeta = document.getElementById('postModalMeta');
const modalCover = document.getElementById('postModalCover');
const modalContent = document.getElementById('postModalContent');
const modalClose = document.getElementById('postModalClose');
const modalCloseBottom = document.getElementById('postModalCloseBottom');
const modalWhatsApp = document.getElementById('postModalWhatsApp');

async function openPostModal(post) {
  if (!post) return;

  modalTitle.textContent = post.title || '';
  modalMeta.textContent = formatPostMeta(post);

  if (post.cover) {
    modalCover.style.display = 'block';
    modalCover.innerHTML = `<img src="${post.cover}">`;
  } else {
    modalCover.style.display = 'none';
  }

  modalContent.innerHTML = '<p>Carregando conteúdo...</p>';

  if (!post.file) {
    modalContent.innerHTML = '<p>Conteúdo não encontrado.</p>';
  } else {
    try {
      const resp = await fetch(post.file, { cache: 'no-store' });
      const md = await resp.text();
      modalContent.innerHTML = simpleMarkdownToHtml(md);
    } catch {
      modalContent.innerHTML = '<p>Erro ao carregar conteúdo.</p>';
    }
  }

  modalWhatsApp.onclick = () => {
    window.open(waLink('generic'), '_blank');
  };

  modalBackdrop.classList.add('open');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closePostModal() {
  modalBackdrop.classList.remove('open');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closePostModal);
modalCloseBottom.addEventListener('click', closePostModal);
