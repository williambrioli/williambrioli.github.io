    content: `
<p>Há discussões de casal que começam por uma frase aparentemente pequena, mas terminam muito longe dela. Uma palavra atravessada, um silêncio depois de uma pergunta ou uma crítica podem despertar sentimentos que parecem grandes demais para aquilo que acabou de acontecer.</p>

<p>Isso acontece porque, em uma relação, nem sempre escutamos apenas o que o outro acabou de dizer. Também podemos escutar aquilo que aquela fala representa para nós a partir da nossa própria história.</p>

<p>É como um eco: a voz pertence ao presente, mas o som pode trazer algo de muito antes.</p>

<h2>Quando uma palavra toca uma história antiga</h2>

<p>Para a psicanálise, a maneira como uma pessoa se relaciona não pode ser compreendida apenas pelo comportamento visível naquele momento. A história individual, os vínculos anteriores, os desejos, os medos e os conflitos inconscientes também participam da forma como cada um estabelece seus relacionamentos.</p>

<p>Por isso, uma mesma situação pode produzir respostas muito diferentes. Para uma pessoa, o silêncio do parceiro pode significar apenas necessidade de espaço. Para outra, pode representar abandono, rejeição ou falta de amor.</p>

<p>Isso não significa que todo conflito de casal seja causado pelo passado. Tampouco significa justificar atitudes que machucam. Significa olhar para o conflito com um pouco mais de profundidade e perguntar o que, além da situação concreta, está sendo mobilizado naquele encontro.</p>

<p>Às vezes, por trás de uma cobrança existe uma necessidade de reconhecimento. Por trás da irritação, pode existir medo. Por trás de uma acusação, pode haver um pedido que a pessoa ainda não conseguiu formular de outra maneira.</p>

<h2>Quando o conflito deixa de ser apenas uma disputa</h2>

<p>Um casal pode entrar facilmente em um ciclo no qual cada conversa termina na tentativa de descobrir quem está certo. Um fala, o outro se defende. O outro responde, e a primeira pessoa contra-ataca. As palavras aumentam, mas a possibilidade de escuta diminui.</p>

<p>Na perspectiva psicanalítica, o conflito também pode ser escutado. Ele pode revelar repetições, expectativas e formas de funcionamento que permanecem presentes na relação sem que o casal perceba claramente.</p>

<p>Escutar não significa concordar com tudo. Significa criar espaço para compreender aquilo que está sendo dito e também aquilo que aparece por trás da fala.</p>

<p>Quando existe esse espaço, uma discussão pode ganhar outro significado. Em vez de apenas separar, ela pode mostrar onde estão as feridas, as necessidades e os impasses que precisam ser elaborados.</p>

<h2>Talvez algumas relações precisem de uma escuta diferente</h2>

<p>Nem todo relacionamento precisa continuar, e nem todo conflito pode ser resolvido. Existem situações em que a separação pode ser necessária e saudável.</p>

<p>Mas também existem relações nas quais o problema não está simplesmente na ausência de amor. O casal pode estar preso a uma forma repetitiva de se comunicar, reagir e interpretar um ao outro.</p>

<p>A psicoterapia pode oferecer um espaço protegido para que essas questões sejam colocadas em palavras e compreendidas com maior profundidade. No caso da terapia de casal, esse espaço pode ajudar a observar a dinâmica existente entre os dois, sem reduzir a relação à procura por um culpado.</p>

<p>Às vezes, aquilo que parece ser apenas uma discussão é uma dor tentando encontrar palavras.</p>

<p>E quando existe espaço para falar e, principalmente, para escutar, aquilo que antes produzia distância pode começar a revelar um novo caminho para o encontro.</p>

<h2>Referências</h2>

</ul>

<script>
/*
  Aqui começam várias funções importantes para fazer a página funcionar.
  Elas cuidam de:
  - transformar markdown em HTML
  - carregar lista de posts
  - abrir e fechar o modal
  - inserir conteúdo na página
*/
/* ==========================================
   FUNÇÃO: simpleMarkdownToHtml()
   Serve para transformar markdown simples em HTML.
   ========================================== */
function simpleMarkdownToHtml(md) {
  if (!md) return '';
  // Troca quebras de linha antigas por novas
  let text = md.replace(/\r\n/g, '\n');
  // Títulos de vários níveis
  text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h2>$1</h2>');
  // Negrito **
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Itálico *
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Transformar listas
  text = text.replace(/^[\-\*] (.*)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/gm, match => `<ul>${match}</ul>`);
  // Transformar blocos separados por linha vazia em parágrafos
  const parts = text.split(/\n{2,}/).map(block => {
    if (/^<h[23]>/.test(block) || /^<ul>/.test(block)) {
      return block;
    }
    return `<p>${block.trim()}</p>`;
  });
  return parts.join('\n');
}
/* ==========================================
   CARREGAMENTO DE POSTS
   Lê o arquivo posts.json e cria os cards na página.
   ========================================== */
let POSTS_CACHE = [];
async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  const msgEl = document.getElementById('postsMessage');
  if (!grid || !msgEl) return;
  msgEl.style.display = 'none';
  msgEl.textContent = '';
  try {
    // Busca o arquivo que contém os posts
    const response = await fetch('/posts/posts.json', { cache: 'no-store' });
    if (!response.ok) {
      throw new Error('Não foi possível carregar a lista de artigos.');
    }
    const posts = await response.json();
    if (!Array.isArray(posts) || posts.length === 0) {
      msgEl.style.display = 'block';
      msgEl.textContent = 'Ainda não há artigos publicados.';
      return;
    }
    // Ordena do mais recente para o mais antigo
posts.sort((a, b) => new Date(b.date) - new Date(a.date));
POSTS_CACHE = posts;
renderPosts(posts, grid);
  } catch (err) {
    console.error(err);
    msgEl.style.display = 'block';
    msgEl.textContent = 'Ocorreu um problema ao carregar artigos.';
  }
}
/* ==========================================
   FUNÇÃO: renderPosts()
   Cria os cards dinamicamente dentro do grid.
   ========================================== */
function renderPosts(posts, container) {
  container.innerHTML = '';
  posts.forEach(post => {
    const card = document.createElement('article');
    card.className = 'post-card';
    // Capa
    if (post.cover) {
      const img = document.createElement('img');
      img.src = post.cover;
      img.alt = post.title || '';
      card.appendChild(img);
    }
    const body = document.createElement('div');
    body.className = 'post-card-body';
    // Tag (ex: Psicologia)
    if (Array.isArray(post.tags) && post.tags.length > 0) {
      const tag = document.createElement('span');
      tag.className = 'post-tag';
      tag.textContent = post.tags[0];
      body.appendChild(tag);
    }
    // Título
    const h3 = document.createElement('h3');
    h3.textContent = post.title || 'Artigo sem título';
    body.appendChild(h3);
    // Meta (data + autor)
    const meta = document.createElement('div');
    meta.className = 'post-meta';
    meta.textContent = formatPostMeta(post);
    body.appendChild(meta);
    // Resumo
    if (post.excerpt) {
      const excerpt = document.createElement('div');
      excerpt.className = 'post-excerpt';
      excerpt.textContent = post.excerpt;
      body.appendChild(excerpt);
    }
    // Botão do card
    const footer = document.createElement('div');
    footer.className = 'post-card-footer';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = window.SITE_DATA.buttons.readMore;
    // O texto vem do arquivo site-data.js
    btn.addEventListener('click', () => {
      // abre a página do artigo
      if (post.html) {
        window.location.href = "/" + post.html;
      }
    });
    footer.appendChild(btn);
    body.appendChild(footer);
    card.appendChild(body);
    container.appendChild(card);
  });
}
/* ==========================================
   FUNÇÃO: formatPostMeta()
   Formata a data + autor do post
   ========================================== */
function formatPostMeta(post) {
  let parts = [];
  if (post.date) {
    const d = new Date(post.date);
    if (!isNaN(d)) {
      const formatted = d.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
      parts.push(formatted);
    }
  }
  if (post.author) {
    parts.push('por ' + post.author);
  }
  return parts.join(' • ');
}
/* ==========================================
   FUNÇÃO DO MODAL (abrir e fechar)
   ========================================== */
const modalBackdrop = document.getElementById('postModalBackdrop');
const modalTitle = document.getElementById('postModalTitle');
const modalMeta = document.getElementById('postModalMeta');
const modalCover = document.getElementById('postModalCover');
const modalContent = document.getElementById('postModalContent');
const modalClose = document.getElementById('postModalClose');
const modalCloseBottom = document.getElementById('postModalCloseBottom');
const modalWhatsApp = document.getElementById('postModalWhatsApp');
async function openPostModal(post) {
  if (!post) return;
  modalTitle.textContent = post.title || '';
  modalMeta.textContent = formatPostMeta(post);
  if (post.cover) {
    modalCover.style.display = 'block';
    modalCover.innerHTML = `<img src="${post.cover}">`;
  } else {
    modalCover.style.display = 'none';
  }
  modalContent.innerHTML = '<p>Carregando conteúdo...</p>';
  if (!post.file) {
    modalContent.innerHTML = '<p>Conteúdo não encontrado.</p>';
  } else {
    try {
      const resp = await fetch(post.file, { cache: 'no-store' });
      const md = await resp.text();
      modalContent.innerHTML = simpleMarkdownToHtml(md);
    } catch {
      modalContent.innerHTML = '<p>Erro ao carregar conteúdo.</p>';
    }
  }
  modalWhatsApp.onclick = () => {
    window.open(waLink('generic'), '_blank');
  };
  modalBackdrop.classList.add('open');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closePostModal() {
  modalBackdrop.classList.remove('open');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
modalClose.addEventListener('click', closePostModal);
modalCloseBottom.addEventListener('click', closePostModal);
/* ==========================================
   INICIALIZAÇÃO GERAL DA PÁGINA
   ========================================== */
document.addEventListener('DOMContentLoaded', () => {
  loadPosts();
});

});
</script>
