    content: `
<p>Imagine alguém sentado diante de um terapeuta, ouvindo uma história aparentemente simples. Não há controle da mente, perda completa da consciência nem qualquer tipo de “mágica”. Ainda assim, depois de alguns minutos, aquela pessoa percebe que sua atenção mudou, que o corpo está mais relaxado e que determinadas lembranças, imagens ou sensações parecem surgir com mais facilidade. É nesse território que se encontra a hipnose desenvolvida a partir do trabalho de Milton H. Erickson.</p>

<p>Erickson foi um psiquiatra norte-americano que transformou a maneira como a hipnose passou a ser compreendida dentro da psicoterapia. Em vez de tratar o paciente como alguém que deveria simplesmente obedecer a comandos, ele valorizava a individualidade, a experiência subjetiva, a linguagem e os recursos que a própria pessoa já possuía.</p>

<h2>O que é a hipnose de Milton Erickson?</h2>

<p>A chamada hipnose ericksoniana é uma abordagem terapêutica inspirada no trabalho clínico de Milton H. Erickson. Ela utiliza estados de atenção concentrada, relaxamento, imaginação, linguagem terapêutica, metáforas e sugestões para favorecer novas formas de perceber e experimentar determinadas situações.</p>

<p>Um ponto importante é entender que hipnose não significa dormir. Durante uma experiência hipnótica, a pessoa pode continuar consciente do ambiente, ouvir o terapeuta e, em muitos casos, conversar normalmente. O que pode mudar é a maneira como a atenção é direcionada e como determinadas experiências internas são vivenciadas.</p>

<p>Erickson também não trabalhava com a ideia de que existiria uma técnica única que funcionasse da mesma maneira para todas as pessoas. Sua prática clínica era profundamente individualizada. Ele observava a maneira como cada paciente falava, reagia, imaginava, lembrava e interpretava suas experiências para construir intervenções adequadas àquela pessoa.</p>

<h2>Por que a abordagem de Erickson é diferente?</h2>

<p>Na hipnose mais tradicional, é comum imaginar um profissional utilizando comandos diretos, como se estivesse dizendo ao paciente exatamente o que ele deve sentir ou fazer. A abordagem de Erickson caminhou por outra direção.</p>

<p>Ele frequentemente utilizava sugestões indiretas, histórias e metáforas. Em vez de simplesmente dizer a uma pessoa como ela deveria mudar, uma intervenção poderia criar condições para que ela encontrasse uma nova maneira de compreender determinada experiência.</p>

<p>É como abrir uma porta sem empurrar a pessoa para dentro. O terapeuta apresenta possibilidades, conduz a atenção e cria um contexto favorável para que o próprio indivíduo participe ativamente do processo.</p>

<p>Essa característica ajuda a compreender por que a hipnose ericksoniana está muito mais próxima de uma relação psicoterapêutica colaborativa do que da imagem popular de um hipnotizador controlando alguém.</p>

<h2>O que acontece com a atenção durante a hipnose?</h2>

<p>Um dos mecanismos importantes envolvidos na hipnose é a alteração do foco atencional. Todos nós experimentamos algo parecido no cotidiano.</p>

<p>Quando uma pessoa está profundamente concentrada em um filme, em uma música, em uma leitura ou até mesmo em seus próprios pensamentos, pode deixar de perceber temporariamente alguns estímulos ao redor. A atenção não desapareceu; ela simplesmente foi direcionada.</p>

<p>A hipnose utiliza, de maneira estruturada, essa capacidade humana de concentrar a atenção e modificar a experiência subjetiva. Dependendo da pessoa e do contexto, isso pode envolver mudanças na percepção corporal, na imaginação, na sensação de tempo, na lembrança e na maneira como determinados pensamentos são experimentados.</p>

<p>Isso ajuda a explicar por que a hipnose pode ser compreendida como um estado de atenção diferenciada, e não como uma espécie de desligamento da consciência.</p>

<h2>Mas por que uma sugestão pode produzir uma mudança?</h2>

<p>Uma sugestão hipnótica não funciona simplesmente porque alguém “manda” o cérebro fazer alguma coisa. A resposta depende da interação entre atenção, expectativa, imaginação, contexto terapêutico e características individuais.</p>

<p>Quando uma pessoa imagina uma situação com intensidade suficiente, seu organismo pode responder de maneira coerente com aquilo que está sendo imaginado. Pense, por exemplo, em imaginar o som de uma música que marcou sua vida. Mesmo sem a música estar tocando, você pode perceber mentalmente sua melodia, lembrar de uma cena ou experimentar uma emoção associada àquele momento.</p>

<p>A metáfora pode ser entendida como um mapa. Ela não obriga ninguém a seguir determinado caminho, mas pode ajudar a pessoa a enxergar caminhos que antes não estavam tão claros. Na abordagem ericksoniana, histórias e metáforas podem ser utilizadas justamente para favorecer novas associações e possibilidades de compreensão.</p>

<h2>O papel do inconsciente na hipnose ericksoniana</h2>

<p>Erickson utilizava frequentemente a ideia de processos inconscientes em seu trabalho. Entretanto, é importante não confundir isso com a ideia popular de que o inconsciente seria uma espécie de “segundo cérebro” escondido dentro da mente, capaz de receber ordens secretas.</p>

<p>Na prática psicoterapêutica, podemos falar de processos que influenciam pensamentos, emoções, hábitos e comportamentos sem que a pessoa tenha plena consciência de todos eles. A hipnose pode favorecer o acesso a experiências internas, associações e formas alternativas de perceber uma situação.</p>

<p>Isso não significa que tudo o que surge durante a hipnose seja necessariamente uma lembrança verdadeira ou uma informação escondida. Memórias humanas podem ser reconstruídas e sofrer influências. Por isso, a hipnose não deve ser tratada como um método infalível para descobrir acontecimentos do passado.</p>

<h2>A pessoa perde o controle durante a hipnose?</h2>

<p>Essa é uma das dúvidas mais comuns — e também uma das maiores fontes de mitos sobre hipnose.</p>

<p>Na hipnose terapêutica, a pessoa não se transforma em uma espécie de marionete. Ela não precisa aceitar automaticamente tudo o que o terapeuta diz e não perde, por definição, sua capacidade de decisão.</p>

<p>O processo depende da participação do próprio indivíduo. A relação terapêutica, a confiança, a disposição para o trabalho e a capacidade de direcionar a atenção fazem parte da experiência.</p>

<p>Por isso, a hipnose clínica deve ser conduzida dentro de critérios profissionais e éticos, por alguém adequadamente capacitado e respeitando os limites e as condições da pessoa atendida.</p>

<h2>Hipnose e psicoterapia podem trabalhar juntas?</h2>

<p>Sim. A hipnose pode ser utilizada como recurso dentro de determinados processos psicoterapêuticos, dependendo da formação do profissional, da demanda apresentada e da indicação clínica.</p>

<p>Ela não precisa ser vista como uma terapia completamente separada de outras formas de psicoterapia. Pode funcionar como uma ferramenta complementar para trabalhar aspectos relacionados à percepção, ansiedade, dor, hábitos, recursos internos e outras demandas específicas, sempre considerando a avaliação individual.</p>

<p>O mais importante é não transformar a hipnose em uma promessa de solução rápida para qualquer problema. Como acontece com qualquer recurso terapêutico, seus resultados dependem de diversos fatores e não podem ser garantidos antecipadamente.</p>

<h2>Por que a hipnose de Erickson continua sendo estudada?</h2>

<p>A importância histórica de Milton Erickson está menos em ter criado uma fórmula universal de hipnose e mais em ter demonstrado uma maneira diferente de compreender a relação entre linguagem, experiência subjetiva e psicoterapia.</p>

<p>Sua abordagem valorizava aquilo que havia de singular em cada pessoa. Uma mesma palavra, história ou intervenção poderia produzir efeitos completamente diferentes em indivíduos diferentes. Por isso, observar o paciente era tão importante quanto aplicar uma técnica.</p>

<p>Esse princípio continua relevante para a psicoterapia contemporânea: pessoas não são problemas padronizados esperando soluções padronizadas. A experiência de cada indivíduo precisa ser compreendida dentro de sua própria história.</p>

<h2>Hipnose não é mágica: é uma forma de trabalhar com a experiência humana</h2>

<p>A hipnose ericksoniana pode parecer misteriosa quando observada de fora, principalmente porque trabalha com elementos que todos nós utilizamos diariamente: atenção, imaginação, linguagem, memória, expectativa e percepção.</p>

<p>O que muda é a maneira como esses elementos são organizados dentro de um contexto terapêutico.</p>

<p>Compreender a hipnose dessa maneira ajuda a abandonar dois extremos: de um lado, a ideia de que ela é uma forma de controle absoluto da mente; de outro, a promessa de que ela seria capaz de resolver qualquer sofrimento em poucos minutos.</p>

<p>Entre esses dois extremos existe algo muito mais interessante: uma ferramenta psicoterapêutica que pode ajudar determinadas pessoas a experimentar novas possibilidades de percepção e mudança.</p>

<h2>Conclusão</h2>

<p>A hipnose de Milton Erickson representa uma maneira particular de utilizar a linguagem, a atenção, a imaginação e a relação terapêutica para favorecer mudanças na experiência do indivíduo. Seu funcionamento não depende de poderes especiais do terapeuta, mas de processos psicológicos que podem ser influenciados pelo contexto, pela expectativa, pela atenção e pela participação ativa da pessoa.</p>

<p>Mais do que fazer alguém “entrar em transe”, a proposta ericksoniana procura compreender como aquela pessoa organiza sua própria experiência e como pode encontrar novas alternativas para lidar com aquilo que vive.</p>

<p>Por isso, quando utilizada de maneira responsável, a hipnose pode ser compreendida não como perda de controle, mas como uma possibilidade de ampliar o diálogo entre aquilo que a pessoa percebe conscientemente e outras experiências internas que podem contribuir para o processo psicoterapêutico.</p>

<script>
/*
  Aqui começam várias funções importantes para fazer a página funcionar.
  Elas cuidam de:
  - transformar markdown em HTML
  - carregar lista de posts
  - abrir e fechar o modal
  - inserir conteúdo na página
*/
/* ==========================================
   FUNÇÃO: simpleMarkdownToHtml()
   Serve para transformar markdown simples em HTML.
   ========================================== */
function simpleMarkdownToHtml(md) {
  if (!md) return '';
  // Troca quebras de linha antigas por novas
  let text = md.replace(/\r\n/g, '\n');
  // Títulos de vários níveis
  text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h2>$1</h2>');
  // Negrito **
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Itálico *
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Transformar listas
  text = text.replace(/^[\-\*] (.*)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/gm, match => `<ul>${match}</ul>`);
  // Transformar blocos separados por linha vazia em parágrafos
  const parts = text.split(/\n{2,}/).map(block => {
    if (/^<h[23]>/.test(block) || /^<ul>/.test(block)) {
      return block;
    }
    return `<p>${block.trim()}</p>`;
  });
  return parts.join('\n');
}
/* ==========================================
   CARREGAMENTO DE POSTS
   Lê o arquivo posts.json e cria os cards na página.
   ========================================== */
let POSTS_CACHE = [];
async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  const msgEl = document.getElementById('postsMessage');
  if (!grid || !msgEl) return;
  msgEl.style.display = 'none';
  msgEl.textContent = '';
  try {
    // Busca o arquivo que contém os posts
    const response = await fetch('/posts/posts.json', { cache: 'no-store' });
    if (!response.ok) {
      throw new Error('Não foi possível carregar a lista de artigos.');
    }
    const posts = await response.json();
    if (!Array.isArray(posts) || posts.length === 0) {
      msgEl.style.display = 'block';
      msgEl.textContent = 'Ainda não há artigos publicados.';
      return;
    }
    // Ordena do mais recente para o mais antigo
posts.sort((a, b) => new Date(b.date) - new Date(a.date));
POSTS_CACHE = posts;
renderPosts(posts, grid);
  } catch (err) {
    console.error(err);
    msgEl.style.display = 'block';
    msgEl.textContent = 'Ocorreu um problema ao carregar artigos.';
  }
}
/* ==========================================
   FUNÇÃO: renderPosts()
   Cria os cards dinamicamente dentro do grid.
   ========================================== */
function renderPosts(posts, container) {
  container.innerHTML = '';
  posts.forEach(post => {
    const card = document.createElement('article');
    card.className = 'post-card';
    // Capa
    if (post.cover) {
      const img = document.createElement('img');
      img.src = post.cover;
      img.alt = post.title || '';
      card.appendChild(img);
    }
    const body = document.createElement('div');
    body.className = 'post-card-body';
    // Tag (ex: Psicologia)
    if (Array.isArray(post.tags) && post.tags.length > 0) {
      const tag = document.createElement('span');
      tag.className = 'post-tag';
      tag.textContent = post.tags[0];
      body.appendChild(tag);
    }
    // Título
    const h3 = document.createElement('h3');
    h3.textContent = post.title || 'Artigo sem título';
    body.appendChild(h3);
    // Meta (data + autor)
    const meta = document.createElement('div');
    meta.className = 'post-meta';
    meta.textContent = formatPostMeta(post);
    body.appendChild(meta);
    // Resumo
    if (post.excerpt) {
      const excerpt = document.createElement('div');
      excerpt.className = 'post-excerpt';
      excerpt.textContent = post.excerpt;
      body.appendChild(excerpt);
    }
    // Botão do card
    const footer = document.createElement('div');
    footer.className = 'post-card-footer';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = window.SITE_DATA.buttons.readMore;
    // O texto vem do arquivo site-data.js
    btn.addEventListener('click', () => {
      // abre a página do artigo
      if (post.html) {
        window.location.href = "/" + post.html;
      }
    });
    footer.appendChild(btn);
    body.appendChild(footer);
    card.appendChild(body);
    container.appendChild(card);
  });
}
/* ==========================================
   FUNÇÃO: formatPostMeta()
   Formata a data + autor do post
   ========================================== */
function formatPostMeta(post) {
  let parts = [];
  if (post.date) {
    const d = new Date(post.date);
    if (!isNaN(d)) {
      const formatted = d.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
      parts.push(formatted);
    }
  }
  if (post.author) {
    parts.push('por ' + post.author);
  }
  return parts.join(' • ');
}
/* ==========================================
   FUNÇÃO DO MODAL (abrir e fechar)
   ========================================== */
const modalBackdrop = document.getElementById('postModalBackdrop');
const modalTitle = document.getElementById('postModalTitle');
const modalMeta = document.getElementById('postModalMeta');
const modalCover = document.getElementById('postModalCover');
const modalContent = document.getElementById('postModalContent');
const modalClose = document.getElementById('postModalClose');
const modalCloseBottom = document.getElementById('postModalCloseBottom');
const modalWhatsApp = document.getElementById('postModalWhatsApp');
async function openPostModal(post) {
  if (!post) return;
  modalTitle.textContent = post.title || '';
  modalMeta.textContent = formatPostMeta(post);
  if (post.cover) {
    modalCover.style.display = 'block';
    modalCover.innerHTML = `<img src="${post.cover}">`;
  } else {
    modalCover.style.display = 'none';
  }
  modalContent.innerHTML = '<p>Carregando conteúdo...</p>';
  if (!post.file) {
    modalContent.innerHTML = '<p>Conteúdo não encontrado.</p>';
  } else {
    try {
      const resp = await fetch(post.file, { cache: 'no-store' });
      const md = await resp.text();
      modalContent.innerHTML = simpleMarkdownToHtml(md);
    } catch {
      modalContent.innerHTML = '<p>Erro ao carregar conteúdo.</p>';
    }
  }
  modalWhatsApp.onclick = () => {
    window.open(waLink('generic'), '_blank');
  };
  modalBackdrop.classList.add('open');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closePostModal() {
  modalBackdrop.classList.remove('open');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
modalClose.addEventListener('click', closePostModal);
modalCloseBottom.addEventListener('click', closePostModal);
