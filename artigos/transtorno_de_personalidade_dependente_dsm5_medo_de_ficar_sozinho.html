    content: `



<p>Há pessoas que, diante das escolhas mais simples da vida, sentem uma ansiedade intensa. Decidir qual caminho seguir, mudar de emprego, terminar um relacionamento ou até mesmo escolher um curso pode parecer impossível sem a opinião de alguém. Aos poucos, a necessidade constante de orientação transforma-se em dependência emocional, e o medo de ficar sozinho passa a dirigir praticamente todas as decisões.</p>

<p>O Transtorno de Personalidade Dependente (TPD) é um dos transtornos de personalidade descritos no <em>Manual Diagnóstico e Estatístico de Transtornos Mentais – DSM-5-TR</em>. Diferentemente do que muitas pessoas imaginam, ele não significa apenas ser carente ou gostar de companhia. Trata-se de um padrão persistente de comportamento caracterizado por necessidade excessiva de ser cuidado, dificuldade em assumir responsabilidades pessoais e intenso medo de separação.</p>

<p>Uma metáfora ajuda a compreender esse funcionamento psicológico: imagine uma árvore jovem que cresceu sempre apoiada em uma estaca. Durante anos, ela acreditou que somente permaneceria em pé se continuasse presa àquele suporte. Mesmo quando já possui condições para sustentar-se sozinha, continua acreditando que cairá caso precise caminhar sem apoio. De maneira semelhante, quem apresenta Transtorno de Personalidade Dependente frequentemente subestima suas próprias capacidades e acredita que precisa de outra pessoa para conduzir sua vida.</p>

<h2>Explicação científica simplificada</h2>

<p>O Transtorno de Personalidade Dependente integra o Grupo C dos transtornos de personalidade do DSM-5-TR, grupo caracterizado por padrões de comportamento marcados por ansiedade, insegurança e medo.</p>

<p>Segundo o DSM-5-TR, o transtorno consiste em uma necessidade excessiva e persistente de ser cuidado, levando a comportamento submisso, dependente e medo intenso de separação, iniciado no começo da vida adulta e presente em diferentes contextos.</p>

<p>Para o diagnóstico, o DSM-5 descreve características como:</p>

<ul>
<li>Dificuldade para tomar decisões cotidianas sem excesso de aconselhamento ou reafirmação.</li>
<li>Necessidade de que outras pessoas assumam responsabilidades importantes de sua vida.</li>
<li>Dificuldade para discordar por medo de perder apoio ou aprovação.</li>
<li>Dificuldade para iniciar projetos de forma independente devido à falta de autoconfiança.</li>
<li>Esforços excessivos para obter apoio e proteção, mesmo aceitando situações desagradáveis.</li>
<li>Desconforto intenso quando está sozinho por sentir-se incapaz de cuidar de si mesmo.</li>
<li>Busca rapidamente outro relacionamento quando um vínculo importante termina.</li>
<li>Preocupação persistente com a possibilidade de ser abandonado e precisar cuidar de si próprio.</li>
</ul>

<p>Esses comportamentos precisam ser persistentes, causar sofrimento significativo ou prejuízo funcional e não serem explicados melhor por outro transtorno mental, condição médica ou uso de substâncias.</p>

<h2>Características associadas</h2>

<p>Além dos critérios diagnósticos, o DSM-5 descreve diversas características frequentemente observadas nesse transtorno.</p>

<p>Pessoas com Transtorno de Personalidade Dependente costumam apresentar baixa autoestima, percepção de incapacidade e tendência a minimizar suas competências pessoais. Frequentemente acreditam que outras pessoas são mais capazes de tomar decisões corretas.</p>

<p>Também podem demonstrar:</p>

<ul>
<li>Grande sensibilidade à desaprovação.</li>
<li>Medo intenso da rejeição ou abandono.</li>
<li>Dificuldade em expressar necessidades ou opiniões próprias.</li>
<li>Comportamento excessivamente conciliador.</li>
<li>Tendência a permanecer em relacionamentos prejudiciais por receio da solidão.</li>
<li>Necessidade constante de validação externa.</li>
</ul>

<p>Embora possam parecer passivas, essas pessoas frequentemente experimentam sofrimento emocional intenso relacionado ao medo de perder figuras importantes em suas vidas.</p>

<h2>Prevalência</h2>

<p>Segundo o DSM-5-TR, o Transtorno de Personalidade Dependente apresenta prevalência estimada inferior a 1% na população geral, embora diferentes estudos possam encontrar pequenas variações conforme os critérios utilizados.</p>

<p>É importante diferenciar esse transtorno de comportamentos dependentes transitórios observados em momentos específicos da vida, como durante doenças, perdas importantes ou outras situações que naturalmente exigem maior apoio.</p>

<h2>Desenvolvimento e curso</h2>

<p>Os primeiros sinais geralmente tornam-se evidentes no final da adolescência ou no início da vida adulta, período em que aumentam as demandas por autonomia e responsabilidade.</p>

<p>O DSM-5 considera que fatores temperamentais, experiências familiares, estilos de criação e predisposições biológicas podem contribuir para seu desenvolvimento. Entretanto, não existe uma causa única conhecida.</p>

<p>Experiências marcadas por superproteção, controle excessivo ou poucas oportunidades para desenvolver autonomia podem participar da construção desse padrão de funcionamento psicológico, embora não determinem, isoladamente, o aparecimento do transtorno.</p>

<p>Sem tratamento, esse padrão tende a permanecer relativamente estável ao longo da vida, influenciando escolhas afetivas, profissionais e sociais. Contudo, muitas pessoas apresentam melhora significativa quando recebem acompanhamento psicoterapêutico.</p>

<h2>Diagnóstico diferencial</h2>

<p>O diagnóstico deve ser realizado por profissional habilitado, considerando diversas condições que podem apresentar características semelhantes.</p>

<p>Entre os principais diagnósticos diferenciais descritos pelo DSM-5 estão:</p>

<ul>
<li><strong>Transtorno de Personalidade Borderline:</strong> ambos podem apresentar medo de abandono, porém no Borderline predominam instabilidade emocional, impulsividade e alterações intensas da identidade.</li>

<li><strong>Transtorno de Personalidade Evitativa:</strong> pessoas com personalidade evitativa evitam vínculos por medo da rejeição, enquanto indivíduos com personalidade dependente procuram intensamente relacionamentos para obter segurança e proteção.</li>

<li><strong>Transtorno de Ansiedade de Separação:</strong> compartilha o medo de perder figuras de apego, mas apresenta critérios específicos relacionados à ansiedade de separação.</li>

<li><strong>Dependência emocional sem transtorno:</strong> muitas pessoas apresentam comportamentos dependentes em determinados relacionamentos sem preencher critérios para um transtorno de personalidade.</li>
</ul>

<p>Uma avaliação clínica detalhada é indispensável para estabelecer um diagnóstico correto.</p>

<h2>Comorbidades</h2>

<p>O Transtorno de Personalidade Dependente frequentemente ocorre associado a outros transtornos mentais.</p>

<p>Entre as comorbidades descritas pelo DSM-5 destacam-se:</p>

<ul>
<li>Transtornos de ansiedade.</li>
<li>Transtornos depressivos.</li>
<li>Transtorno de Ansiedade de Separação.</li>
<li>Transtorno de Personalidade Evitativa.</li>
<li>Outros transtornos de personalidade do Grupo C.</li>
</ul>

<p>A presença dessas condições pode aumentar o sofrimento psicológico e exigir um planejamento terapêutico individualizado.</p>

<h2>Questões diagnósticas relativas ao sexo e ao gênero</h2>

<p>Historicamente, o Transtorno de Personalidade Dependente foi descrito com maior frequência em mulheres. Entretanto, o DSM-5-TR ressalta que expectativas culturais relacionadas aos papéis de gênero podem influenciar tanto a manifestação quanto o reconhecimento dos sintomas.</p>

<p>Em determinadas culturas, comportamentos de submissão ou dependência podem ser socialmente incentivados em alguns grupos, dificultando a diferenciação entre padrões culturais e manifestações clínicas.</p>

<p>Da mesma forma, homens podem apresentar sintomas semelhantes, mas deixar de procurar ajuda devido a normas sociais que valorizam independência e autossuficiência. Por isso, o diagnóstico deve considerar sempre o contexto sociocultural e evitar interpretações baseadas em estereótipos de gênero.</p>

<h2>Análise profissional aplicada ao tema</h2>

<p>Na prática clínica, muitas pessoas com Transtorno de Personalidade Dependente chegam ao consultório relatando medo constante de decepcionar os outros, insegurança para tomar decisões e grande dificuldade em estabelecer limites saudáveis. Frequentemente acreditam que não possuem competência suficiente para conduzir a própria vida.</p>

<p>Esse padrão pode favorecer relações desequilibradas, nas quais necessidades pessoais são constantemente colocadas em segundo plano para preservar vínculos afetivos. O sofrimento costuma aumentar quando ocorre uma separação, perda ou mudança importante.</p>

<p>O tratamento busca fortalecer a autonomia, ampliar a confiança nas próprias capacidades, desenvolver habilidades para tomada de decisão e construir relacionamentos mais equilibrados.</p>

<h2>Aplicações práticas e orientações</h2>

<ul>
<li>Reconheça que pedir ajuda é saudável, mas depender constantemente dela pode limitar seu desenvolvimento.</li>
<li>Pratique pequenas decisões cotidianas sem buscar confirmação imediata.</li>
<li>Observe se o medo da solidão influencia escolhas importantes.</li>
<li>Desenvolva gradualmente atividades que fortaleçam sua autonomia.</li>
<li>Aprenda a expressar opiniões e necessidades de maneira respeitosa.</li>
<li>Busque avaliação profissional caso perceba sofrimento persistente ou dificuldade significativa para conduzir sua própria vida.</li>
</ul>

<h2>Pontes para psicoterapia</h2>

<p>A psicoterapia constitui uma das principais formas de tratamento para o Transtorno de Personalidade Dependente. O processo terapêutico favorece o fortalecimento da autoestima, da autonomia emocional e da capacidade de tomar decisões de forma progressivamente independente.</p>

<p>Além disso, oferece um espaço seguro para compreender padrões de relacionamento, desenvolver maior confiança nas próprias habilidades e construir vínculos mais saudáveis, baseados em reciprocidade e não em dependência.</p>

<h2>Conclusão</h2>

<p>O Transtorno de Personalidade Dependente é muito mais complexo do que simples carência ou necessidade de companhia. Trata-se de um padrão persistente de funcionamento psicológico marcado pela dificuldade em confiar nas próprias capacidades e pelo medo intenso de perder apoio e proteção.</p>

<p>Compreender seus critérios diagnósticos, características e formas de tratamento contribui para reduzir estigmas e ampliar o acesso ao cuidado especializado. Assim como a árvore que aprende, aos poucos, que suas raízes são capazes de sustentá-la sem a antiga estaca, muitas pessoas descobrem na psicoterapia recursos internos para desenvolver autonomia, segurança e relacionamentos mais saudáveis.</p>

<script>
/*
  Aqui começam várias funções importantes para fazer a página funcionar.
  Elas cuidam de:
  - transformar markdown em HTML
  - carregar lista de posts
  - abrir e fechar o modal
  - inserir conteúdo na página
*/

/* ==========================================
   FUNÇÃO: simpleMarkdownToHtml()
   Serve para transformar markdown simples em HTML.
   ========================================== */
function simpleMarkdownToHtml(md) {
  if (!md) return '';

  // Troca quebras de linha antigas por novas
  let text = md.replace(/\r\n/g, '\n');

  // Títulos de vários níveis
  text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h2>$1</h2>');

  // Negrito **
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Itálico *
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Transformar listas
  text = text.replace(/^[\-\*] (.*)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/gm, match => `<ul>${match}</ul>`);

  // Transformar blocos separados por linha vazia em parágrafos
  const parts = text.split(/\n{2,}/).map(block => {
    if (/^<h[23]>/.test(block) || /^<ul>/.test(block)) {
      return block;
    }
    return `<p>${block.trim()}</p>`;
  });

  return parts.join('\n');
}


/* ==========================================
   CARREGAMENTO DE POSTS
   Lê o arquivo posts.json e cria os cards na página.
   ========================================== */

let POSTS_CACHE = [];

async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  const msgEl = document.getElementById('postsMessage');

  if (!grid || !msgEl) return;

  msgEl.style.display = 'none';
  msgEl.textContent = '';

  try {
    // Busca o arquivo que contém os posts
    const response = await fetch('/posts/posts.json', { cache: 'no-store' });

    if (!response.ok) {
      throw new Error('Não foi possível carregar a lista de artigos.');
    }

    const posts = await response.json();

    if (!Array.isArray(posts) || posts.length === 0) {
      msgEl.style.display = 'block';
      msgEl.textContent = 'Ainda não há artigos publicados.';
      return;
    }

    // Ordena do mais recente para o mais antigo
posts.sort((a, b) => new Date(b.date) - new Date(a.date));

POSTS_CACHE = posts;
renderPosts(posts, grid);

  } catch (err) {
    console.error(err);
    msgEl.style.display = 'block';
    msgEl.textContent = 'Ocorreu um problema ao carregar artigos.';
  }
}


/* ==========================================
   FUNÇÃO: renderPosts()
   Cria os cards dinamicamente dentro do grid.
   ========================================== */
function renderPosts(posts, container) {
  container.innerHTML = '';

  posts.forEach(post => {
    const card = document.createElement('article');
    card.className = 'post-card';

    // Capa
    if (post.cover) {
      const img = document.createElement('img');
      img.src = post.cover;
      img.alt = post.title || '';
      card.appendChild(img);
    }

    const body = document.createElement('div');
    body.className = 'post-card-body';

    // Tag (ex: Psicologia)
    if (Array.isArray(post.tags) && post.tags.length > 0) {
      const tag = document.createElement('span');
      tag.className = 'post-tag';
      tag.textContent = post.tags[0];
      body.appendChild(tag);
    }

    // Título
    const h3 = document.createElement('h3');
    h3.textContent = post.title || 'Artigo sem título';
    body.appendChild(h3);

    // Meta (data + autor)
    const meta = document.createElement('div');
    meta.className = 'post-meta';
    meta.textContent = formatPostMeta(post);
    body.appendChild(meta);

    // Resumo
    if (post.excerpt) {
      const excerpt = document.createElement('div');
      excerpt.className = 'post-excerpt';
      excerpt.textContent = post.excerpt;
      body.appendChild(excerpt);
    }

    // Botão do card
    const footer = document.createElement('div');
    footer.className = 'post-card-footer';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = window.SITE_DATA.buttons.readMore;
    // O texto vem do arquivo site-data.js

    btn.addEventListener('click', () => {
      // abre a página do artigo
      if (post.html) {
        window.location.href = "/" + post.html;
      }
    });

    footer.appendChild(btn);
    body.appendChild(footer);
    card.appendChild(body);
    container.appendChild(card);
  });
}


/* ==========================================
   FUNÇÃO: formatPostMeta()
   Formata a data + autor do post
   ========================================== */
function formatPostMeta(post) {
  let parts = [];

  if (post.date) {
    const d = new Date(post.date);
    if (!isNaN(d)) {
      const formatted = d.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
      parts.push(formatted);
    }
  }

  if (post.author) {
    parts.push('por ' + post.author);
  }

  return parts.join(' • ');
}


/* ==========================================
   FUNÇÃO DO MODAL (abrir e fechar)
   ========================================== */
const modalBackdrop = document.getElementById('postModalBackdrop');
const modalTitle = document.getElementById('postModalTitle');
const modalMeta = document.getElementById('postModalMeta');
const modalCover = document.getElementById('postModalCover');
const modalContent = document.getElementById('postModalContent');
const modalClose = document.getElementById('postModalClose');
const modalCloseBottom = document.getElementById('postModalCloseBottom');
const modalWhatsApp = document.getElementById('postModalWhatsApp');

async function openPostModal(post) {
  if (!post) return;

  modalTitle.textContent = post.title || '';
  modalMeta.textContent = formatPostMeta(post);

  if (post.cover) {
    modalCover.style.display = 'block';
    modalCover.innerHTML = `<img src="${post.cover}">`;
  } else {
    modalCover.style.display = 'none';
  }

  modalContent.innerHTML = '<p>Carregando conteúdo...</p>';

  if (!post.file) {
    modalContent.innerHTML = '<p>Conteúdo não encontrado.</p>';
  } else {
    try {
      const resp = await fetch(post.file, { cache: 'no-store' });
      const md = await resp.text();
      modalContent.innerHTML = simpleMarkdownToHtml(md);
    } catch {
      modalContent.innerHTML = '<p>Erro ao carregar conteúdo.</p>';
    }
  }

  modalWhatsApp.onclick = () => {
    window.open(waLink('generic'), '_blank');
  };

  modalBackdrop.classList.add('open');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closePostModal() {
  modalBackdrop.classList.remove('open');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closePostModal);
modalCloseBottom.addEventListener('click', closePostModal);
