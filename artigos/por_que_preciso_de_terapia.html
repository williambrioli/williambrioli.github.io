    date: "2026-08-27",
    author: "William Brioli",
    cover: "https://williambrioli.com.br/img/HEROog.jpg",

    content: `<p>Às vezes, a decisão de procurar terapia não começa com uma grande crise. Pode começar com uma sensação mais simples: “Eu não estou bem, mas também não sei exatamente o que está acontecendo”. Pode ser um cansaço que não passa, dificuldades nos relacionamentos, ansiedade, pensamentos repetitivos ou simplesmente a percepção de que algumas situações estão ficando difíceis de enfrentar sozinho.</p>

<h2>Explicação científica simplificada</h2>
<p>A saúde mental faz parte do bem-estar e está relacionada à capacidade de lidar com as situações da vida, desenvolver habilidades, trabalhar, aprender e manter relações. Quando o sofrimento emocional começa a interferir de forma significativa na rotina, nos relacionamentos ou na qualidade de vida, buscar ajuda profissional pode ser importante.</p>

<p>A psicoterapia é uma forma de intervenção psicológica que pode ajudar pessoas a compreenderem melhor seus pensamentos, emoções e comportamentos e a desenvolverem maneiras mais adequadas de lidar com suas dificuldades. Evidências científicas mostram que diferentes formas de psicoterapia podem ser eficazes para diversos problemas de saúde mental, especialmente quando a abordagem é adequada às necessidades da pessoa.</p>

<h2>Análise profissional aplicada ao tema</h2>
<p>Precisar de terapia não significa necessariamente estar doente ou ter algum transtorno psicológico. Muitas pessoas procuram psicoterapia porque desejam compreender melhor a própria história, tomar decisões, melhorar relacionamentos, atravessar mudanças ou lidar com situações que estão causando sofrimento.</p>

<p>Um dos benefícios do processo terapêutico é criar um espaço estruturado de reflexão, no qual a pessoa pode falar sobre aquilo que muitas vezes não consegue organizar sozinha. O profissional ajuda a identificar padrões, compreender dificuldades e construir possibilidades de mudança de acordo com as necessidades de cada indivíduo.</p>

<h2>Aplicações práticas e orientações</h2>
<ul>
  <li>Considere procurar ajuda quando o sofrimento emocional estiver persistente ou interferindo na sua vida cotidiana.</li>
  <li>Observe mudanças importantes no sono, no humor, na motivação, nos relacionamentos ou na capacidade de realizar atividades habituais.</li>
  <li>Não espere necessariamente chegar ao limite para buscar apoio. A psicoterapia também pode ser utilizada como espaço de autoconhecimento e prevenção.</li>
  <li>Converse com um profissional qualificado para avaliar suas necessidades e definir o tipo de acompanhamento mais adequado.</li>
</ul>

<h2>Pontes para psicoterapia</h2>
<p>A terapia pode ser um espaço para começar a olhar para aquilo que você vem tentando resolver sozinho. Não é necessário chegar com todas as respostas, nem saber exatamente o que dizer. O processo começa justamente pela possibilidade de falar sobre o que está acontecendo e, junto com o profissional, compreender o que pode estar por trás dessa experiência.</p>

<h2>Conclusão</h2>
<p>Talvez a pergunta não precise ser apenas “Eu preciso de terapia?”. Uma pergunta igualmente importante pode ser: “Como tenho me sentido e quanto isso está afetando a minha vida?”. Buscar psicoterapia pode ser uma forma de cuidar de si, compreender melhor suas experiências e encontrar novos caminhos para lidar com aquilo que hoje parece difícil.</p>

  <script>
  function simpleMarkdownToHtml(md) {
    if (!md) return '';
    let text = md.replace(/\r\n/g, '\n');
    text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
    text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
    text = text.replace(/^# (.*)$/gm, '<h2>$1</h2>');
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    text = text.replace(/^[\-\*] (.*)$/gm, '<li>$1</li>');
    text = text.replace(/(<li>.*<\/li>\n?)+/gm, match => `<ul>${match}</ul>`);
    const parts = text.split(/\n{2,}/).map(block => {
      if (/^<h[23]>/.test(block) || /^<ul>/.test(block)) return block;
      return `<p>${block.trim()}</p>`;
    });
    return parts.join('\n');
  }

  let POSTS_CACHE = [];
  async function loadPosts() {
    const grid = document.getElementById('postsGrid');
    const msgEl = document.getElementById('postsMessage');
    if (!grid || !msgEl) return;
    msgEl.style.display = 'none';
    try {
      const response = await fetch('/posts/posts.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('Erro ao carregar posts');
      const posts = await response.json();
      if (!Array.isArray(posts) || posts.length === 0) {
        msgEl.style.display = 'block';
        msgEl.textContent = 'Ainda não há artigos publicados.';
        return;
      }
      posts.sort((a, b) => new Date(b.date) - new Date(a.date));
      POSTS_CACHE = posts;
      renderPosts(posts, grid);
    } catch (err) {
      console.error(err);
      msgEl.style.display = 'block';
      msgEl.textContent = 'Ocorreu um problema ao carregar artigos.';
    }
  }

  function renderPosts(posts, container) {
    container.innerHTML = '';
    posts.forEach(post => {
      const card = document.createElement('article');
      card.className = 'post-card';
      if (post.cover) {
        const img = document.createElement('img');
        img.src = post.cover;
        img.alt = post.title || '';
        card.appendChild(img);
      }
      const body = document.createElement('div');
      body.className = 'post-card-body';
      if (Array.isArray(post.tags) && post.tags.length > 0) {
        const tag = document.createElement('span');
        tag.className = 'post-tag';
        tag.textContent = post.tags[0];
        body.appendChild(tag);
      }
      const h3 = document.createElement('h3');
      h3.textContent = post.title || 'Artigo sem título';
      body.appendChild(h3);
      const meta = document.createElement('div');
      meta.className = 'post-meta';
      meta.textContent = formatPostMeta(post);
      body.appendChild(meta);
      if (post.excerpt) {
        const excerpt = document.createElement('div');
        excerpt.className = 'post-excerpt';
        excerpt.textContent = post.excerpt;
        body.appendChild(excerpt);
      }
      const footer = document.createElement('div');
      footer.className = 'post-card-footer';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn';
      btn.textContent = window.SITE_DATA?.buttons?.readMore || 'Ler mais';
      btn.addEventListener('click', () => {
        if (post.html) window.location.href = "/" + post.html;
      });
      footer.appendChild(btn);
      body.appendChild(footer);
      card.appendChild(body);
      container.appendChild(card);
    });
  }

  function formatPostMeta(post) {
    let parts = [];
    if (post.date) {
      const d = new Date(post.date);
      if (!isNaN(d)) {
        parts.push(d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }));
      }
    }
    if (post.author) parts.push('por ' + post.author);
    return parts.join(' • ');
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadPosts();
  });

  document.addEventListener("DOMContentLoaded", () => {

    document.getElementById("ogDescription").content = ARTICLE.description;
    document.getElementById("ogImage").content = ARTICLE.cover;
    document.getElementById("canonicalLink").href = ARTICLE.canonical;

    document.getElementById("articleTitle").textContent = ARTICLE.title;

    const coverImg = document.getElementById("articleCover");
    if (ARTICLE.showCover && ARTICLE.cover && ARTICLE.cover.trim() !== "") {
      coverImg.src = ARTICLE.cover;
      coverImg.alt = ARTICLE.alt || "";
      coverImg.style.display = "block";
    } else {
      coverImg.style.display = "none";
    }

    const date = new Date(ARTICLE.date);
    document.getElementById("articleMeta").textContent =
      date.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" }) + " • por " + ARTICLE.author;

    document.getElementById("articleContent").innerHTML = ARTICLE.content;
  });
  </script>
