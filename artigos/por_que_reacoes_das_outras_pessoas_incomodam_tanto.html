<p>Alguém faz um comentário, demonstra arrogância ou reage de uma maneira que você considera inadequada. Outras pessoas talvez nem deem importância, mas aquilo continua incomodando você. Horas depois, a cena ainda volta à sua cabeça. Por que certas atitudes despertam reações tão intensas?</p>

<p>Para Carl Gustav Jung, observar essas situações pode ser uma oportunidade de autoconhecimento. A reação que temos diante do outro nem sempre diz respeito apenas ao comportamento dele. Em determinadas circunstâncias, ela também pode revelar aspectos de nós mesmos que ainda não reconhecemos plenamente.</p>

<h2>O que Jung entendia sobre as reações que temos diante dos outros?</h2>

<p>Na psicologia analítica de Jung, a personalidade não se limita àquilo que conhecemos conscientemente sobre nós. Existem sentimentos, desejos, impulsos e características que permanecem fora da nossa percepção habitual.</p>

<p>Quando alguém manifesta uma característica que rejeitamos profundamente, podemos experimentar uma reação emocional desproporcional à situação. Isso não significa que o comportamento da outra pessoa seja aceitável, nem que todo incômodo tenha uma origem inconsciente. Significa que vale a pena investigar o que tornou aquela experiência tão significativa para nós.</p>

<p>É como se determinada atitude funcionasse como um espelho inesperado: além de mostrar algo sobre o outro, ela pode nos colocar diante de aspectos da nossa própria personalidade que preferiríamos não enxergar.</p>

<h2>A sombra: aquilo que nem sempre queremos reconhecer em nós</h2>

<p>Um dos conceitos centrais da psicologia analítica é a <strong>sombra</strong>. Jung utilizou esse conceito para se referir a aspectos da personalidade que não são reconhecidos ou integrados conscientemente. Eles podem incluir características socialmente reprovadas, mas também capacidades, desejos e qualidades que a pessoa aprendeu a reprimir.</p>

<p>Imagine alguém que se incomoda intensamente com pessoas que expressam suas opiniões sem receio de desagradar. Ao investigar essa reação, essa pessoa pode descobrir que aprendeu a evitar conflitos, a buscar aprovação ou a esconder o que realmente pensa.</p>

<p>Nesse caso, o incômodo não revela necessariamente que ela seja igual à pessoa que critica. Pode indicar, porém, uma dificuldade própria relacionada à espontaneidade, à assertividade ou à liberdade de se posicionar.</p>

<p>Reconhecer a sombra não significa justificar atitudes prejudiciais. Significa ampliar a consciência sobre si mesmo, inclusive sobre aquilo que foi reprimido, negado ou considerado inaceitável ao longo da vida.</p>

<h2>Como transformar o incômodo em autoconhecimento?</h2>

<p>Quando uma reação alheia provocar irritação, ressentimento ou desconforto persistente, experimente fazer uma pausa antes de concluir o que aquela pessoa representa.</p>

<p>Pergunte a si mesmo: o que exatamente me incomodou? Essa atitude ultrapassou um limite importante para mim? Ela desperta alguma lembrança ou situação recorrente? Existe alguma característica que condeno nos outros, mas que tenho dificuldade de reconhecer em mim?</p>

<p>Essas perguntas não servem para procurar defeitos escondidos a qualquer custo. O objetivo é diferenciar o comportamento real do outro daquilo que a situação mobiliza internamente.</p>

<p>Na psicoterapia, esse processo pode ser aprofundado com o auxílio de um profissional, permitindo identificar padrões emocionais, conflitos internos e formas habituais de se relacionar. A investigação precisa considerar a história e o contexto de cada pessoa, sem transformar todo desconforto em uma interpretação psicológica automática.</p>

<h2>O que suas reações podem revelar sobre você?</h2>

<p>Segundo a perspectiva junguiana, o autoconhecimento envolve reconhecer não apenas as qualidades com as quais nos identificamos, mas também os aspectos que mantemos à margem da consciência. Algumas reações emocionais podem funcionar como pistas desse processo.</p>

<p>Isso não significa que o problema esteja sempre em você. O outro pode, de fato, agir com desrespeito, invadir limites ou apresentar comportamentos prejudiciais. A questão é perceber se, além de avaliar a situação externa, existe algo em sua própria experiência que merece atenção.</p>

<p>O desenvolvimento pessoal começa, muitas vezes, quando deixamos de perguntar apenas por que o outro age daquela maneira e passamos a investigar o que acontece conosco diante disso. É nesse espaço entre o estímulo e a reação que pode surgir uma oportunidade real de mudança.</p>

<script>
/*
  Aqui começam várias funções importantes para fazer a página funcionar.
  Elas cuidam de:
  - transformar markdown em HTML
  - carregar lista de posts
  - abrir e fechar o modal
  - inserir conteúdo na página
*/
/* ==========================================
   FUNÇÃO: simpleMarkdownToHtml()
   Serve para transformar markdown simples em HTML.
   ========================================== */
function simpleMarkdownToHtml(md) {
  if (!md) return '';
  // Troca quebras de linha antigas por novas
  let text = md.replace(/\r\n/g, '\n');
  // Títulos de vários níveis
  text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h2>$1</h2>');
  // Negrito **
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Itálico *
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Transformar listas
  text = text.replace(/^[\-\*] (.*)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/gm, match => `<ul>${match}</ul>`);
  // Transformar blocos separados por linha vazia em parágrafos
  const parts = text.split(/\n{2,}/).map(block => {
    if (/^<h[23]>/.test(block) || /^<ul>/.test(block)) {
      return block;
    }
    return `<p>${block.trim()}</p>`;
  });
  return parts.join('\n');
}
/* ==========================================
   CARREGAMENTO DE POSTS
   Lê o arquivo posts.json e cria os cards na página.
   ========================================== */
let POSTS_CACHE = [];
async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  const msgEl = document.getElementById('postsMessage');
  if (!grid || !msgEl) return;
  msgEl.style.display = 'none';
  msgEl.textContent = '';
  try {
    // Busca o arquivo que contém os posts
    const response = await fetch('/posts/posts.json', { cache: 'no-store' });
    if (!response.ok) {
      throw new Error('Não foi possível carregar a lista de artigos.');
    }
    const posts = await response.json();
    if (!Array.isArray(posts) || posts.length === 0) {
      msgEl.style.display = 'block';
      msgEl.textContent = 'Ainda não há artigos publicados.';
      return;
    }
    // Ordena do mais recente para o mais antigo
posts.sort((a, b) => new Date(b.date) - new Date(a.date));
POSTS_CACHE = posts;
renderPosts(posts, grid);
  } catch (err) {
    console.error(err);
    msgEl.style.display = 'block';
    msgEl.textContent = 'Ocorreu um problema ao carregar artigos.';
  }
}
/* ==========================================
   FUNÇÃO: renderPosts()
   Cria os cards dinamicamente dentro do grid.
   ========================================== */
function renderPosts(posts, container) {
  container.innerHTML = '';
  posts.forEach(post => {
    const card = document.createElement('article');
    card.className = 'post-card';
    // Capa
    if (post.cover) {
      const img = document.createElement('img');
      img.src = post.cover;
      img.alt = post.title || '';
      card.appendChild(img);
    }
    const body = document.createElement('div');
    body.className = 'post-card-body';
    // Tag (ex: Psicologia)
    if (Array.isArray(post.tags) && post.tags.length > 0) {
      const tag = document.createElement('span');
      tag.className = 'post-tag';
      tag.textContent = post.tags[0];
      body.appendChild(tag);
    }
    // Título
    const h3 = document.createElement('h3');
    h3.textContent = post.title || 'Artigo sem título';
    body.appendChild(h3);
    // Meta (data + autor)
    const meta = document.createElement('div');
    meta.className = 'post-meta';
    meta.textContent = formatPostMeta(post);
    body.appendChild(meta);
    // Resumo
    if (post.excerpt) {
      const excerpt = document.createElement('div');
      excerpt.className = 'post-excerpt';
      excerpt.textContent = post.excerpt;
      body.appendChild(excerpt);
    }
    // Botão do card
    const footer = document.createElement('div');
    footer.className = 'post-card-footer';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = window.SITE_DATA.buttons.readMore;
    // O texto vem do arquivo site-data.js
    btn.addEventListener('click', () => {
      // abre a página do artigo
      if (post.html) {
        window.location.href = "/" + post.html;
      }
    });
    footer.appendChild(btn);
    body.appendChild(footer);
    card.appendChild(body);
    container.appendChild(card);
  });
}
/* ==========================================
   FUNÇÃO: formatPostMeta()
   Formata a data + autor do post
   ========================================== */
function formatPostMeta(post) {
  let parts = [];
  if (post.date) {
    const d = new Date(post.date);
    if (!isNaN(d)) {
      const formatted = d.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
      parts.push(formatted);
    }
  }
  if (post.author) {
    parts.push('por ' + post.author);
  }
  return parts.join(' • ');
}
/* ==========================================
   FUNÇÃO DO MODAL (abrir e fechar)
   ========================================== */
const modalBackdrop = document.getElementById('postModalBackdrop');
const modalTitle = document.getElementById('postModalTitle');
const modalMeta = document.getElementById('postModalMeta');
const modalCover = document.getElementById('postModalCover');
const modalContent = document.getElementById('postModalContent');
const modalClose = document.getElementById('postModalClose');
const modalCloseBottom = document.getElementById('postModalCloseBottom');
const modalWhatsApp = document.getElementById('postModalWhatsApp');
async function openPostModal(post) {
  if (!post) return;
  modalTitle.textContent = post.title || '';
  modalMeta.textContent = formatPostMeta(post);
  if (post.cover) {
    modalCover.style.display = 'block';
    modalCover.innerHTML = `<img src="${post.cover}">`;
  } else {
    modalCover.style.display = 'none';
  }
  modalContent.innerHTML = '<p>Carregando conteúdo...</p>';
  if (!post.file) {
    modalContent.innerHTML = '<p>Conteúdo não encontrado.</p>';
  } else {
    try {
      const resp = await fetch(post.file, { cache: 'no-store' });
      const md = await resp.text();
      modalContent.innerHTML = simpleMarkdownToHtml(md);
    } catch {
      modalContent.innerHTML = '<p>Erro ao carregar conteúdo.</p>';
    }
  }
  modalWhatsApp.onclick = () => {
    window.open(waLink('generic'), '_blank');
  };
  modalBackdrop.classList.add('open');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closePostModal() {
  modalBackdrop.classList.remove('open');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
modalClose.addEventListener('click', closePostModal);
modalCloseBottom.addEventListener('click', closePostModal);
/* ==========================================
   INICIALIZAÇÃO GERAL DA PÁGINA
   ========================================== */
document.addEventListener('DOMContentLoaded', () => {
  loadPosts();
});

    coverImg.src = ARTICLE.cover;

    coverImg.style.display = "block";

  // Data + autor
  const date = new Date(ARTICLE.date);

      month: "long",
      year: "numeric"
    }) + " • por " + ARTICLE.author;
  // Conteúdo do artigo
  document.getElementById("articleContent").innerHTML = ARTICLE.content;
});
</script>

});
