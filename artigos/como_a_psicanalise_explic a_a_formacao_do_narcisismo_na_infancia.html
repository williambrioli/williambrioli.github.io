    content: `
<p>Uma criança pequena costuma acreditar que o mundo gira ao seu redor. Quando sente fome, espera ser alimentada. Quando chora, espera que alguém se aproxime. Quando sente medo, procura um adulto que lhe ofereça proteção. Essa necessidade de atenção não é egoísmo: faz parte do desenvolvimento emocional e da construção de sua relação consigo mesma e com o mundo.</p>

<p>Na psicanálise, o narcisismo está relacionado ao modo como a pessoa investe afeto em si mesma, constrói sua identidade e desenvolve o sentimento de valor pessoal. A infância ocupa um lugar importante nesse processo, pois é durante os primeiros vínculos que a criança começa a formar uma imagem de quem é, do quanto merece ser amada e de como pode se relacionar com os outros.</p>

<p>Compreender essa formação exige olhar além dos comportamentos que parecem vaidade, orgulho ou necessidade excessiva de reconhecimento. A questão central é entender como o indivíduo aprende a se perceber e a lidar com suas necessidades emocionais.</p>

<h2>O que significa narcisismo para a psicanálise?</h2>

<p>Na linguagem cotidiana, chamar alguém de narcisista geralmente significa dizer que essa pessoa é arrogante, vaidosa ou excessivamente preocupada consigo mesma. Na teoria psicanalítica, entretanto, o conceito é mais amplo.</p>

<p>Sigmund Freud desenvolveu uma compreensão do narcisismo como parte da organização da vida psíquica. Em sua obra <em>Introdução ao narcisismo</em>, publicada originalmente em 1914, ele descreveu o investimento da energia psíquica no próprio eu, distinguindo aspectos do narcisismo primário e do narcisismo secundário.</p>

<p>De maneira simplificada, o narcisismo primário corresponde a uma condição inicial do desenvolvimento, na qual o investimento afetivo está fortemente relacionado à própria experiência da criança. Já o narcisismo secundário envolve o retorno ao eu de investimentos afetivos que anteriormente estavam dirigidos a objetos externos, como pessoas e relações.</p>

<p>Esses conceitos pertencem a uma construção teórica específica da psicanálise. Não devem ser entendidos como etapas rígidas, facilmente observáveis ou suficientes, por si só, para explicar a personalidade de alguém.</p>

<h2>Como os primeiros vínculos participam da formação do narcisismo?</h2>

<p>O bebê depende de outras pessoas para sobreviver. Mais do que receber alimentação, precisa de cuidados, proteção, contato e respostas às suas necessidades. Aos poucos, essas experiências participam da construção de sua segurança emocional e de sua maneira de se relacionar.</p>

<p>Quando um adulto acolhe o choro, oferece conforto e reconhece os sinais de desconforto da criança, contribui para que ela desenvolva recursos para lidar com as próprias emoções. Isso não significa que todas as necessidades devam ser atendidas imediatamente ou que os pais precisem agir de maneira perfeita. O desenvolvimento acontece em relações reais, marcadas por acertos, desencontros e reparações.</p>

<p>Podemos imaginar esse processo como a construção de uma casa. O cuidado recebido na infância funciona como parte da fundação: não determina sozinho tudo o que será construído, mas participa da sustentação sobre a qual a pessoa desenvolverá sua identidade, seus vínculos e sua autoestima.</p>

<p>Essa imagem também ajuda a compreender por que não existe uma explicação única para o narcisismo. A história familiar importa, mas a personalidade se desenvolve pela interação de diferentes fatores, incluindo temperamento, experiências sociais, cultura e relações construídas ao longo da vida.</p>

<h2>Quando a necessidade de reconhecimento se torna central</h2>

<p>Durante o crescimento, a criança começa a perceber que é uma pessoa diferente das demais. Descobre que possui desejos próprios, mas também encontra limites, frustrações e necessidades que não podem ser atendidas o tempo inteiro.</p>

<p>Ser elogiada, reconhecida e valorizada faz parte desse processo. O problema não está em gostar de receber atenção, sentir orgulho de uma conquista ou desejar ser admirada. Essas experiências são comuns e podem coexistir com a empatia e a capacidade de reconhecer o valor das outras pessoas.</p>

<p>A dificuldade pode aparecer quando o sentimento de valor pessoal passa a depender excessivamente da aprovação externa. Nesse caso, críticas comuns podem ser vividas como humilhações, erros podem provocar vergonha intensa e a comparação com outras pessoas pode se tornar uma fonte constante de sofrimento.</p>

<p>Em algumas histórias, a pessoa aprendeu a associar o próprio valor ao desempenho, à aparência, às conquistas ou à capacidade de agradar. Em outras, pode ter desenvolvido estratégias para se proteger de sentimentos de inadequação ou rejeição. Essas possibilidades precisam ser investigadas individualmente, sem presumir que todas as pessoas com características narcisistas tenham vivido as mesmas experiências na infância.</p>

<h2>O papel dos elogios, dos limites e das frustrações</h2>

<p>Uma dúvida frequente é se o narcisismo se forma porque a criança recebeu elogios demais ou porque não recebeu amor suficiente. A teoria e a observação clínica não sustentam uma resposta tão simples.</p>

<p>Uma criança pode receber muitos elogios e, ainda assim, desenvolver uma relação saudável consigo mesma. O reconhecimento tende a ser mais construtivo quando valoriza o esforço, a curiosidade, a responsabilidade e o aprendizado, em vez de transmitir a ideia de que ela precisa ser superior às demais pessoas para merecer amor.</p>

<p>Da mesma forma, estabelecer limites não significa rejeitar. Uma criança pode ser amada e, ao mesmo tempo, ouvir que determinado comportamento não é aceitável. Quando os limites são acompanhados de respeito e explicações adequadas à idade, ajudam a desenvolver a capacidade de lidar com frustrações e reconhecer que outras pessoas também possuem necessidades e sentimentos.</p>

<p>O que merece atenção é o padrão das relações. Humilhações frequentes, afeto condicionado ao desempenho, desvalorização persistente ou expectativas incompatíveis com a idade podem contribuir para dificuldades emocionais. Entretanto, não permitem prever automaticamente como aquela criança será na vida adulta.</p>

<h2>O narcisismo infantil significa que a criança terá um transtorno?</h2>

<p>Não. É fundamental distinguir características esperadas do desenvolvimento infantil de padrões persistentes de funcionamento da personalidade.</p>

<p>Crianças pequenas podem demonstrar dificuldade para compartilhar, buscar atenção constantemente, reagir mal a uma negativa ou acreditar que suas vontades devem ser atendidas. Essas manifestações precisam ser compreendidas de acordo com a idade, o contexto e o desenvolvimento emocional, e não interpretadas automaticamente como sinais de um transtorno.</p>

<p>O Transtorno da Personalidade Narcisista é uma condição clínica que envolve um padrão persistente de grandiosidade, necessidade de admiração e dificuldades relacionadas à empatia, entre outros aspectos diagnósticos. Sua avaliação exige considerar o funcionamento global da pessoa, a duração e a intensidade das características, os prejuízos associados e outros fatores relevantes.</p>

<p>Não é possível concluir que alguém apresenta esse transtorno apenas porque gosta de aparecer, demonstra orgulho, tem dificuldade para aceitar críticas ou foi criado de determinada maneira. Tampouco é adequado atribuir um diagnóstico a uma criança com base em comportamentos isolados.</p>

<p>Quando há preocupação com o desenvolvimento emocional infantil, a avaliação profissional deve considerar as necessidades da criança, suas relações e o contexto em que vive, evitando rótulos que possam prejudicar sua compreensão de si mesma.</p>

<h2>Como a psicoterapia pode ajudar a compreender essas experiências?</h2>

<p>Na vida adulta, algumas pessoas percebem que precisam ser admiradas para se sentirem seguras, têm dificuldade para reconhecer erros ou vivenciam críticas como ataques pessoais. Outras oscilam entre uma imagem de superioridade e sentimentos intensos de inadequação. Essas experiências podem afetar relacionamentos, trabalho e autoestima, mas não possuem uma única causa.</p>

<p>A psicoterapia oferece um espaço para investigar esses padrões, reconhecer emoções e compreender como determinadas experiências influenciam a maneira de pensar, sentir e agir. Na abordagem psicanalítica, esse trabalho pode envolver a exploração da história pessoal, dos vínculos significativos, dos conflitos emocionais e das formas de proteção construídas ao longo do desenvolvimento.</p>

<p>O objetivo não é encontrar um culpado na família nem reduzir a pessoa à sua infância. É ampliar a compreensão sobre si mesma e identificar possibilidades de mudança no presente.</p>

<p>Também é importante lembrar que buscar ajuda não significa necessariamente ter um transtorno. Alguém pode procurar psicoterapia porque sofre com a necessidade de aprovação, enfrenta conflitos recorrentes ou deseja desenvolver relações mais equilibradas consigo mesmo e com os outros.</p>

<h2>Conclusão</h2>

<p>Para a psicanálise, a formação do narcisismo está relacionada à maneira como o indivíduo organiza seus investimentos afetivos, constrói a imagem de si mesmo e desenvolve suas relações com o mundo. As experiências infantis têm relevância nesse processo, especialmente os vínculos de cuidado, o reconhecimento e a maneira como a criança aprende a lidar com limites e frustrações.</p>

<p>Entretanto, a infância não determina sozinha o destino emocional de ninguém. Não existe uma fórmula que permita explicar o narcisismo a partir de um único comportamento dos pais ou de uma experiência isolada. Cada história precisa ser compreendida em sua singularidade.</p>

<p>Entender o próprio funcionamento emocional pode ser um passo importante para construir uma relação mais segura consigo mesmo, reconhecer o valor das outras pessoas e desenvolver vínculos menos dependentes da aprovação externa. A psicoterapia pode ajudar nesse percurso, oferecendo condições para transformar padrões que antes pareciam inevitáveis em possibilidades de escolha.</p>

<script>
/*
  Aqui começam várias funções importantes para fazer a página funcionar.
  Elas cuidam de:
  - transformar markdown em HTML
  - carregar lista de posts
  - abrir e fechar o modal
  - inserir conteúdo na página
*/
/* ==========================================
   FUNÇÃO: simpleMarkdownToHtml()
   Serve para transformar markdown simples em HTML.
   ========================================== */
function simpleMarkdownToHtml(md) {
  if (!md) return '';
  // Troca quebras de linha antigas por novas
  let text = md.replace(/\r\n/g, '\n');
  // Títulos de vários níveis
  text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h2>$1</h2>');
  // Negrito **
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Itálico *
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Transformar listas
  text = text.replace(/^[\-\*] (.*)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/gm, match => `<ul>${match}</ul>`);
  // Transformar blocos separados por linha vazia em parágrafos
  const parts = text.split(/\n{2,}/).map(block => {
    if (/^<h[23]>/.test(block) || /^<ul>/.test(block)) {
      return block;
    }
    return `<p>${block.trim()}</p>`;
  });
  return parts.join('\n');
}
/* ==========================================
   CARREGAMENTO DE POSTS
   Lê o arquivo posts.json e cria os cards na página.
   ========================================== */
let POSTS_CACHE = [];
async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  const msgEl = document.getElementById('postsMessage');
  if (!grid || !msgEl) return;
  msgEl.style.display = 'none';
  msgEl.textContent = '';
  try {
    // Busca o arquivo que contém os posts
    const response = await fetch('/posts/posts.json', { cache: 'no-store' });
    if (!response.ok) {
      throw new Error('Não foi possível carregar a lista de artigos.');
    }
    const posts = await response.json();
    if (!Array.isArray(posts) || posts.length === 0) {
      msgEl.style.display = 'block';
      msgEl.textContent = 'Ainda não há artigos publicados.';
      return;
    }
    // Ordena do mais recente para o mais antigo
posts.sort((a, b) => new Date(b.date) - new Date(a.date));
POSTS_CACHE = posts;
renderPosts(posts, grid);
  } catch (err) {
    console.error(err);
    msgEl.style.display = 'block';
    msgEl.textContent = 'Ocorreu um problema ao carregar artigos.';
  }
}
/* ==========================================
   FUNÇÃO: renderPosts()
   Cria os cards dinamicamente dentro do grid.
   ========================================== */
function renderPosts(posts, container) {
  container.innerHTML = '';
  posts.forEach(post => {
    const card = document.createElement('article');
    card.className = 'post-card';
    // Capa
    if (post.cover) {
      const img = document.createElement('img');
      img.src = post.cover;
      img.alt = post.title || '';
      card.appendChild(img);
    }
    const body = document.createElement('div');
    body.className = 'post-card-body';
    // Tag (ex: Psicologia)
    if (Array.isArray(post.tags) && post.tags.length > 0) {
      const tag = document.createElement('span');
      tag.className = 'post-tag';
      tag.textContent = post.tags[0];
      body.appendChild(tag);
    }
    // Título
    const h3 = document.createElement('h3');
    h3.textContent = post.title || 'Artigo sem título';
    body.appendChild(h3);
    // Meta (data + autor)
    const meta = document.createElement('div');
    meta.className = 'post-meta';
    meta.textContent = formatPostMeta(post);
    body.appendChild(meta);
    // Resumo
    if (post.excerpt) {
      const excerpt = document.createElement('div');
      excerpt.className = 'post-excerpt';
      excerpt.textContent = post.excerpt;
      body.appendChild(excerpt);
    }
    // Botão do card
    const footer = document.createElement('div');
    footer.className = 'post-card-footer';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = window.SITE_DATA.buttons.readMore;
    // O texto vem do arquivo site-data.js
    btn.addEventListener('click', () => {
      // abre a página do artigo
      if (post.html) {
        window.location.href = "/" + post.html;
      }
    });
    footer.appendChild(btn);
    body.appendChild(footer);
    card.appendChild(body);
    container.appendChild(card);
  });
}
/* ==========================================
   FUNÇÃO: formatPostMeta()
   Formata a data + autor do post
   ========================================== */
function formatPostMeta(post) {
  let parts = [];
  if (post.date) {
    const d = new Date(post.date);
    if (!isNaN(d)) {
      const formatted = d.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
      parts.push(formatted);
    }
  }
  if (post.author) {
    parts.push('por ' + post.author);
  }
  return parts.join(' • ');
}
/* ==========================================
   FUNÇÃO DO MODAL (abrir e fechar)
   ========================================== */
const modalBackdrop = document.getElementById('postModalBackdrop');
const modalTitle = document.getElementById('postModalTitle');
const modalMeta = document.getElementById('postModalMeta');
const modalCover = document.getElementById('postModalCover');
const modalContent = document.getElementById('postModalContent');
const modalClose = document.getElementById('postModalClose');
const modalCloseBottom = document.getElementById('postModalCloseBottom');
const modalWhatsApp = document.getElementById('postModalWhatsApp');
async function openPostModal(post) {
  if (!post) return;
  modalTitle.textContent = post.title || '';
  modalMeta.textContent = formatPostMeta(post);
  if (post.cover) {
    modalCover.style.display = 'block';
    modalCover.innerHTML = `<img src="${post.cover}">`;
  } else {
    modalCover.style.display = 'none';
  }
  modalContent.innerHTML = '<p>Carregando conteúdo...</p>';
  if (!post.file) {
    modalContent.innerHTML = '<p>Conteúdo não encontrado.</p>';
  } else {
    try {
      const resp = await fetch(post.file, { cache: 'no-store' });
      const md = await resp.text();
      modalContent.innerHTML = simpleMarkdownToHtml(md);
    } catch {
      modalContent.innerHTML = '<p>Erro ao carregar conteúdo.</p>';
    }
  }
  modalWhatsApp.onclick = () => {
    window.open(waLink('generic'), '_blank');
  };
  modalBackdrop.classList.add('open');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closePostModal() {
  modalBackdrop.classList.remove('open');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
modalClose.addEventListener('click', closePostModal);
modalCloseBottom.addEventListener('click', closePostModal);
