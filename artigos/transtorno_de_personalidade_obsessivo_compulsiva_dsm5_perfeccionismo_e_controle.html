    content: `



<p>Imagine um maestro que passa tanto tempo ajustando cada instrumento da orquestra que o concerto nunca começa. Ele revisa a posição das cadeiras, corrige detalhes mínimos das partituras e exige que tudo esteja absolutamente perfeito antes da primeira nota. Enquanto busca a execução ideal, o tempo passa e a apresentação deixa de acontecer. Essa metáfora ajuda a compreender como muitas pessoas vivem com o Transtorno de Personalidade Obsessivo-Compulsiva (TPOC): a busca incessante pela perfeição pode acabar impedindo a própria vida de seguir seu curso.</p>

<p>O Transtorno de Personalidade Obsessivo-Compulsiva é descrito no <em>Manual Diagnóstico e Estatístico de Transtornos Mentais – DSM-5-TR</em> como um padrão persistente de preocupação com ordem, perfeccionismo, controle mental e interpessoal, às custas de flexibilidade, abertura e eficiência. Apesar do nome semelhante, esse transtorno não é o mesmo que o Transtorno Obsessivo-Compulsivo (TOC). Enquanto o TOC é caracterizado pela presença de obsessões e compulsões, o TPOC refere-se a um modo estável de funcionamento da personalidade que influencia praticamente todas as áreas da vida.</p>

<p>Muitas pessoas enxergam o perfeccionismo como uma qualidade. Entretanto, quando a necessidade de controle passa a limitar relacionamentos, dificultar decisões, gerar sofrimento e comprometer o funcionamento diário, ela deixa de ser apenas uma característica e pode representar um transtorno de personalidade.</p>

<h2>Explicação científica simplificada</h2>

<p>O Transtorno de Personalidade Obsessivo-Compulsiva pertence ao Grupo C dos transtornos de personalidade do DSM-5-TR, grupo caracterizado por padrões marcados por ansiedade, cautela e necessidade de controle.</p>

<p>Segundo o DSM-5-TR, trata-se de um padrão persistente de preocupação com ordem, perfeccionismo e controle, iniciado no começo da vida adulta e presente em diferentes contextos.</p>

<p>O diagnóstico exige a presença de características como:</p>

<ul>
<li>Preocupação excessiva com detalhes, listas, regras, organização ou cronogramas, a ponto de perder de vista o objetivo principal da atividade.</li>
<li>Perfeccionismo que interfere na conclusão das tarefas.</li>
<li>Dedicação excessiva ao trabalho e à produtividade, em prejuízo do lazer e dos relacionamentos.</li>
<li>Rigidez quanto a valores morais, éticos ou princípios.</li>
<li>Dificuldade para descartar objetos sem utilidade, mesmo quando não possuem valor sentimental.</li>
<li>Relutância em delegar tarefas, a menos que outras pessoas façam exatamente do seu modo.</li>
<li>Estilo econômico excessivamente rígido em relação ao dinheiro.</li>
<li>Rigidez e teimosia persistentes.</li>
</ul>

<p>Esses padrões precisam ser duradouros, causar sofrimento significativo ou prejuízo funcional e não serem melhor explicados por outro transtorno mental ou condição clínica.</p>

<h2>Características associadas</h2>

<p>Além dos critérios diagnósticos, o DSM-5 descreve diversas características frequentemente observadas em pessoas com Transtorno de Personalidade Obsessivo-Compulsiva.</p>

<p>Esses indivíduos costumam apresentar elevado senso de responsabilidade, forte necessidade de previsibilidade e grande dificuldade em lidar com mudanças inesperadas. Frequentemente acreditam que existe apenas uma maneira correta de realizar determinada tarefa.</p>

<p>Também podem apresentar:</p>

<ul>
<li>Dificuldade para relaxar.</li>
<li>Necessidade intensa de controle.</li>
<li>Baixa tolerância ao erro.</li>
<li>Autocrítica elevada.</li>
<li>Exigência excessiva consigo mesmos e com outras pessoas.</li>
<li>Dificuldade para expressar emoções de maneira espontânea.</li>
<li>Rigidez cognitiva diante de opiniões diferentes.</li>
</ul>

<p>Embora essas características possam favorecer desempenho em algumas atividades organizacionais, quando intensas acabam produzindo sofrimento, conflitos interpessoais e redução da qualidade de vida.</p>

<h2>Prevalência</h2>

<p>Segundo o DSM-5-TR, a prevalência estimada do Transtorno de Personalidade Obsessivo-Compulsiva na população geral varia entre aproximadamente 2,1% e 7,9%, tornando-se um dos transtornos de personalidade mais frequentemente encontrados em estudos clínicos.</p>

<p>É importante lembrar que gostar de organização, planejamento ou disciplina não significa apresentar esse transtorno. O diagnóstico depende da intensidade, persistência e do impacto funcional dessas características.</p>

<h2>Desenvolvimento e curso</h2>

<p>Os primeiros sinais costumam tornar-se evidentes no final da adolescência ou no início da vida adulta, quando aumentam as responsabilidades acadêmicas, profissionais e sociais.</p>

<p>O DSM-5 considera que fatores temperamentais, predisposições biológicas e experiências familiares podem contribuir para seu desenvolvimento. Ambientes excessivamente rígidos, altamente críticos ou marcados por expectativas muito elevadas podem participar desse processo, embora não constituam causa única.</p>

<p>Sem tratamento, o padrão tende a permanecer relativamente estável ao longo da vida, influenciando escolhas profissionais, relações afetivas e desempenho ocupacional. Em muitos casos, pessoas procuram ajuda apenas quando o excesso de perfeccionismo começa a comprometer significativamente sua vida pessoal ou profissional.</p>

<h2>Diagnóstico diferencial</h2>

<p>O diagnóstico diferencial é essencial, especialmente devido à semelhança do nome com outros transtornos.</p>

<p>Entre os principais diagnósticos diferenciais descritos pelo DSM-5 destacam-se:</p>

<ul>
<li><strong>Transtorno Obsessivo-Compulsivo (TOC):</strong> no TOC predominam obsessões e compulsões reconhecidas como excessivas; no TPOC predominam traços persistentes de perfeccionismo, controle e rigidez, geralmente considerados adequados pela própria pessoa.</li>

<li><strong>Transtorno de Personalidade Narcisista:</strong> ambos podem apresentar perfeccionismo, mas no transtorno narcisista a motivação costuma estar relacionada à grandiosidade e necessidade de admiração.</li>

<li><strong>Transtorno de Personalidade Esquizoide:</strong> pessoas esquizoides podem parecer emocionalmente distantes, porém a motivação não decorre da necessidade de controle.</li>

<li><strong>Traços de personalidade conscienciosa:</strong> organização, responsabilidade e disciplina fazem parte da personalidade saudável quando não geram sofrimento ou prejuízo significativo.</li>
</ul>

<p>A avaliação clínica realizada por profissional habilitado é indispensável para estabelecer o diagnóstico correto.</p>

<h2>Comorbidades</h2>

<p>O Transtorno de Personalidade Obsessivo-Compulsiva pode ocorrer associado a outras condições psicológicas.</p>

<p>Entre as principais comorbidades descritas pelo DSM-5 encontram-se:</p>

<ul>
<li>Transtorno Obsessivo-Compulsivo.</li>
<li>Transtornos de ansiedade.</li>
<li>Transtornos depressivos.</li>
<li>Transtornos alimentares, especialmente anorexia nervosa.</li>
<li>Outros transtornos de personalidade do Grupo C.</li>
</ul>

<p>A presença dessas condições pode intensificar o sofrimento emocional e exigir planejamento terapêutico individualizado.</p>

<h2>Questões diagnósticas relativas ao sexo e ao gênero</h2>

<p>Segundo o DSM-5-TR, o Transtorno de Personalidade Obsessivo-Compulsiva parece ser diagnosticado com maior frequência em homens em alguns estudos clínicos. Entretanto, fatores culturais, expectativas sociais e diferenças na procura por tratamento podem influenciar esses resultados.</p>

<p>Além disso, determinadas características como perfeccionismo, disciplina e elevada dedicação ao trabalho podem ser interpretadas de maneiras diferentes conforme o contexto cultural e os papéis sociais relacionados ao sexo e ao gênero.</p>

<p>Por isso, o diagnóstico deve sempre considerar o contexto de vida da pessoa, evitando interpretações baseadas apenas em estereótipos culturais ou expectativas sociais.</p>

<h2>Análise profissional aplicada ao tema</h2>

<p>Na prática clínica, pessoas com Transtorno de Personalidade Obsessivo-Compulsiva frequentemente procuram atendimento após anos convivendo com altos níveis de cobrança interna, ansiedade relacionada ao desempenho e dificuldade em flexibilizar comportamentos. Muitas relatam sensação constante de que nunca fazem o suficiente ou de que tudo precisa estar sob controle para evitar erros.</p>

<p>Embora possam apresentar excelente capacidade organizacional, esse padrão frequentemente compromete relacionamentos familiares, vida afetiva e bem-estar emocional. O excesso de perfeccionismo pode transformar atividades simples em tarefas extremamente desgastantes.</p>

<p>O tratamento busca desenvolver maior flexibilidade psicológica, reduzir padrões rígidos de pensamento, fortalecer a tolerância às imperfeições e ampliar a capacidade de adaptação às mudanças.</p>

<h2>Aplicações práticas e orientações</h2>

<ul>
<li>Procure diferenciar excelência de perfeccionismo excessivo.</li>
<li>Reconheça que erros fazem parte do aprendizado e do desenvolvimento humano.</li>
<li>Observe se o excesso de controle interfere em seus relacionamentos.</li>
<li>Pratique concluir tarefas mesmo quando elas não estiverem absolutamente perfeitas.</li>
<li>Inclua momentos de lazer e descanso na rotina.</li>
<li>Busque avaliação profissional caso o perfeccionismo esteja causando sofrimento significativo.</li>
</ul>

<h2>Pontes para psicoterapia</h2>

<p>A psicoterapia representa uma das principais estratégias de tratamento para o Transtorno de Personalidade Obsessivo-Compulsiva. O processo terapêutico favorece o desenvolvimento de maior flexibilidade emocional, revisão de crenças rígidas, fortalecimento da autoestima desvinculada do desempenho e construção de formas mais equilibradas de lidar com responsabilidades.</p>

<p>Ao longo do acompanhamento, muitas pessoas aprendem que qualidade não depende de perfeição absoluta e que viver de forma mais flexível não significa abrir mão da responsabilidade ou da competência.</p>

<h2>Conclusão</h2>

<p>O Transtorno de Personalidade Obsessivo-Compulsiva é muito mais do que gostar de organização. Trata-se de um padrão persistente de perfeccionismo, controle e rigidez que pode comprometer relacionamentos, trabalho e qualidade de vida.</p>

<p>Conhecer seus critérios diagnósticos, compreender suas características e reconhecer suas diferenças em relação ao TOC permite reduzir equívocos e favorecer o acesso ao tratamento adequado. Assim como o maestro precisa iniciar o concerto mesmo sabendo que nenhuma apresentação será absolutamente perfeita, muitas pessoas descobrem, por meio da psicoterapia, que viver plenamente exige mais flexibilidade do que perfeição.</p>

/*

/* ==========================================
   FUNÇÃO: simpleMarkdownToHtml()
   Serve para transformar markdown simples em HTML.
   ========================================== */
function simpleMarkdownToHtml(md) {
  if (!md) return '';

  // Troca quebras de linha antigas por novas
  let text = md.replace(/\r\n/g, '\n');

  // Títulos de vários níveis
  text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h2>$1</h2>');

  // Negrito **
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Itálico *
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Transformar listas
  text = text.replace(/^[\-\*] (.*)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>.*<\/li>\n?)+/gm, match => `<ul>${match}</ul>`);

  // Transformar blocos separados por linha vazia em parágrafos
  const parts = text.split(/\n{2,}/).map(block => {
    if (/^<h[23]>/.test(block) || /^<ul>/.test(block)) {
      return block;
    }
    return `<p>${block.trim()}</p>`;
  });

  return parts.join('\n');
}


/* ==========================================

let POSTS_CACHE = [];

async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  const msgEl = document.getElementById('postsMessage');

  if (!grid || !msgEl) return;

  msgEl.style.display = 'none';
  msgEl.textContent = '';

  try {
    // Busca o arquivo que contém os posts
    const response = await fetch('/posts/posts.json', { cache: 'no-store' });

    if (!response.ok) {
      throw new Error('Não foi possível carregar a lista de artigos.');
    }

    const posts = await response.json();

    if (!Array.isArray(posts) || posts.length === 0) {
      msgEl.style.display = 'block';
      msgEl.textContent = 'Ainda não há artigos publicados.';
      return;
    }

    // Ordena do mais recente para o mais antigo
posts.sort((a, b) => new Date(b.date) - new Date(a.date));

POSTS_CACHE = posts;
renderPosts(posts, grid);

  } catch (err) {
    console.error(err);
    msgEl.style.display = 'block';
    msgEl.textContent = 'Ocorreu um problema ao carregar artigos.';
  }
}


/* ==========================================
   FUNÇÃO: renderPosts()
   Cria os cards dinamicamente dentro do grid.
   ========================================== */
function renderPosts(posts, container) {
  container.innerHTML = '';

  posts.forEach(post => {
    const card = document.createElement('article');
    card.className = 'post-card';

    // Capa
    if (post.cover) {
      const img = document.createElement('img');
      img.src = post.cover;
      img.alt = post.title || '';
      card.appendChild(img);
    }

    const body = document.createElement('div');
    body.className = 'post-card-body';

    // Tag (ex: Psicologia)
    if (Array.isArray(post.tags) && post.tags.length > 0) {
      const tag = document.createElement('span');
      tag.className = 'post-tag';
      tag.textContent = post.tags[0];
      body.appendChild(tag);
    }

    // Título
    const h3 = document.createElement('h3');
    h3.textContent = post.title || 'Artigo sem título';
    body.appendChild(h3);

    // Meta (data + autor)
    const meta = document.createElement('div');
    meta.className = 'post-meta';
    meta.textContent = formatPostMeta(post);
    body.appendChild(meta);

    // Resumo
    if (post.excerpt) {
      const excerpt = document.createElement('div');
      excerpt.className = 'post-excerpt';
      excerpt.textContent = post.excerpt;
      body.appendChild(excerpt);
    }

    // Botão do card
    const footer = document.createElement('div');
    footer.className = 'post-card-footer';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn';
    btn.textContent = window.SITE_DATA.buttons.readMore;
    // O texto vem do arquivo site-data.js

    btn.addEventListener('click', () => {
      // abre a página do artigo
      if (post.html) {
        window.location.href = "/" + post.html;
      }
    });

    footer.appendChild(btn);
    body.appendChild(footer);
    card.appendChild(body);
    container.appendChild(card);
  });
}


/* ==========================================
   FUNÇÃO: formatPostMeta()
   Formata a data + autor do post
   ========================================== */
function formatPostMeta(post) {
  let parts = [];

  if (post.date) {
    const d = new Date(post.date);
    if (!isNaN(d)) {
      const formatted = d.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: 'long',
        year: 'numeric'
      });
      parts.push(formatted);
    }
  }

  if (post.author) {
    parts.push('por ' + post.author);
  }

  return parts.join(' • ');
}


/* ==========================================
   FUNÇÃO DO MODAL (abrir e fechar)
   ========================================== */
const modalBackdrop = document.getElementById('postModalBackdrop');
const modalTitle = document.getElementById('postModalTitle');
const modalMeta = document.getElementById('postModalMeta');
const modalCover = document.getElementById('postModalCover');
const modalContent = document.getElementById('postModalContent');
const modalClose = document.getElementById('postModalClose');
const modalCloseBottom = document.getElementById('postModalCloseBottom');
const modalWhatsApp = document.getElementById('postModalWhatsApp');

async function openPostModal(post) {
  if (!post) return;

  modalTitle.textContent = post.title || '';
  modalMeta.textContent = formatPostMeta(post);

  if (post.cover) {
    modalCover.style.display = 'block';
    modalCover.innerHTML = `<img src="${post.cover}">`;
  } else {
    modalCover.style.display = 'none';
  }

  modalContent.innerHTML = '<p>Carregando conteúdo...</p>';

  if (!post.file) {
    modalContent.innerHTML = '<p>Conteúdo não encontrado.</p>';
  } else {
    try {
      const resp = await fetch(post.file, { cache: 'no-store' });
      const md = await resp.text();
      modalContent.innerHTML = simpleMarkdownToHtml(md);
    } catch {
      modalContent.innerHTML = '<p>Erro ao carregar conteúdo.</p>';
    }
  }

  modalWhatsApp.onclick = () => {
    window.open(waLink('generic'), '_blank');
  };

  modalBackdrop.classList.add('open');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closePostModal() {
  modalBackdrop.classList.remove('open');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

modalClose.addEventListener('click', closePostModal);
modalCloseBottom.addEventListener('click', closePostModal);
