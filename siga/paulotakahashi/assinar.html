<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assinar Termo de Consentimento</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>

<script>
  // Pega o token da URL do seu site
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || '';

  // Monta o endereço do Apps Script com o chaveamento correto
  const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbxX4OGBSMl1am5f-gW1Wc07amYeG4dlOed6gStwLvYLiPlvw9Ahuu4bCl0iHQGwQ6V4/exec'
                      + '?page=assinar&token=' + encodeURIComponent(token);

  // Cria o iframe
  const iframe = document.createElement('iframe');
  iframe.src = appsScriptUrl;
  iframe.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;';
  document.body.appendChild(iframe);
</script>

</body>
</html>
